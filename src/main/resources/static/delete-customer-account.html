<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Delete Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            width: 50%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/profile-customer.html">Profile Customer</a>
    <a class="current-page" href="/delete-account.html">Delete Account</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/profile-customer.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Delete Account</h1>
    <p class="mt-3">Enter your email and password to delete your account:</p>

    <!-- Form -->
    <form id="deleteAccountForm">
        <div class="form-group">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" id="email" placeholder="Enter your email" required type="email">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" id="password" placeholder="Enter your password" required type="password">
        </div>
        <button class="btn btn-lg btn-danger" type="submit">Delete Account</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const deleteAccountForm = document.getElementById("deleteAccountForm");
        const statusMessage = document.getElementById("statusMessage");

        deleteAccountForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!email || !password) {
                displayMessage("Both email and password are required.", "error");
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/v1/users/delete-user?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: 'DELETE',
                    headers: {
                        'Accept': '*/*'
                    }
                });

                if (!response.ok) {
                    const errorResponse = await response.text();
                    throw new Error(errorResponse || "Failed to delete account.");
                }

                const successMessage = await response.text();
                displayMessage(successMessage, "success");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
