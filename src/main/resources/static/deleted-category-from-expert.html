<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Deleted Category From Expert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
            width: 50%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .result-container {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/deleted-category-from-expert.html">Deleted Category From Expert</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Delete Categories From Expert</h1>
    <p class="mt-3">Enter the expert's email and the categories you want to delete:</p>

    <!-- Form -->
    <form id="deleteCategoryForm">
        <div class="form-group">
            <label class="form-label" for="expertEmail">Expert Email:</label>
            <input class="form-control" id="expertEmail" placeholder="Enter expert's email" required type="email">
        </div>
        <div class="form-group">
            <label class="form-label" for="categoryNames">Categories to Delete (comma-separated):</label>
            <input class="form-control" id="categoryNames" placeholder="Enter category names" required type="text">
        </div>
        <button class="btn btn-lg btn-danger" type="submit">Delete Categories</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>

    <!-- Result -->
    <div class="result-container d-none" id="resultContainer">
        <h3>Updated Expert Information</h3>
        <table class="table table-bordered">
            <tbody>
            <tr>
                <th>User Type</th>
                <td id="userType"></td>
            </tr>
            <tr>
                <th>User Name</th>
                <td id="userName"></td>
            </tr>
            <tr>
                <th>First Name</th>
                <td id="firstName"></td>
            </tr>
            <tr>
                <th>Last Name</th>
                <td id="lastName"></td>
            </tr>
            <tr>
                <th>Address</th>
                <td id="address"></td>
            </tr>
            <tr>
                <th>Email</th>
                <td id="email"></td>
            </tr>
            <tr>
                <th>Balance</th>
                <td id="balance"></td>
            </tr>
            <tr>
                <th>Status</th>
                <td id="status"></td>
            </tr>
            <tr>
                <th>Average Rate</th>
                <td id="averageRate"></td>
            </tr>
            <tr>
                <th>Categories</th>
                <td id="categories"></td>
            </tr>
            <tr>
                <th>Created At</th>
                <td id="createdAt"></td>
            </tr>
            <tr>
                <th>Updated At</th>
                <td id="updatedAt"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const deleteCategoryForm = document.getElementById("deleteCategoryForm");
        const statusMessage = document.getElementById("statusMessage");
        const resultContainer = document.getElementById("resultContainer");

        // Retrieve token from localStorage
        function getToken() {
            const token = localStorage.getItem("jwtToken");
            if (!token) {
                alert("Authentication token is missing. Please log in again.");
                throw new Error("Token is missing");
            }
            return token;
        }

        deleteCategoryForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const expertEmail = document.getElementById("expertEmail").value.trim();
            const categoryNames = document.getElementById("categoryNames").value.trim().split(",");

            if (!expertEmail || categoryNames.length === 0) {
                displayMessage("Email and categories are required.", "error");
                return;
            }

            try {
                const token = getToken(); // Retrieve token

                const response = await fetch(`http://localhost:8080/v1/users/expert-category?email=${encodeURIComponent(expertEmail)}&categoryNames=${encodeURIComponent(categoryNames.join(","))}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`, // Send token in Authorization header
                        'Accept': '*/*'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || "Failed to delete categories. Email or categories not found.");
                }

                const updatedExpert = await response.json();
                displayMessage("Categories deleted successfully.", "success");

                // Populate table with updated expert information
                document.getElementById("userType").textContent = updatedExpert.userType || "-";
                document.getElementById("userName").textContent = updatedExpert.userName || "-";
                document.getElementById("firstName").textContent = updatedExpert.firstName || "-";
                document.getElementById("lastName").textContent = updatedExpert.lastName || "-";
                document.getElementById("address").textContent = updatedExpert.address || "-";
                document.getElementById("email").textContent = updatedExpert.email || "-";
                document.getElementById("balance").textContent = updatedExpert.balance || "-";
                document.getElementById("status").textContent = updatedExpert.status || "-";
                document.getElementById("averageRate").textContent = updatedExpert.averageRate || "-";
                document.getElementById("categories").textContent = updatedExpert.categories?.map(cat => cat.name).join(", ") || "No categories";
                document.getElementById("createdAt").textContent = updatedExpert.createdAt || "-";
                document.getElementById("updatedAt").textContent = updatedExpert.updatedAt || "-";

                resultContainer.classList.remove("d-none");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
