<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Filter Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
            width: 70%;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        table {
            margin-top: 20px;
            border: 1px solid #ddd;
            width: 100%;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/get-all-filter-users.html">Filter Users</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Filter Users</h1>
    <p class="mt-3">Use the filters below to retrieve specific users.</p>

    <!-- Filter Form -->
    <form id="filterUsersForm">
        <div class="row">
            <div class="form-group col-md-6">
                <label class="form-label" for="userType">User Type:</label>
                <select class="form-control" id="userType">
                    <option value="">Any</option>
                    <option value="CUSTOMER">Customer</option>
                    <option value="EXPERT">Expert</option>
                </select>
            </div>
            <div class="form-group col-md-6">
                <label class="form-label" for="firstName">First Name:</label>
                <input class="form-control" id="firstName" placeholder="Enter first name" type="text">
            </div>
        </div>
        <div class="row">
            <div class="form-group col-md-6">
                <label class="form-label" for="lastName">Last Name:</label>
                <input class="form-control" id="lastName" placeholder="Enter last name" type="text">
            </div>
            <div class="form-group col-md-6">
                <label class="form-label" for="email">Email:</label>
                <input class="form-control" id="email" placeholder="Enter email" type="email">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label" for="categoryNames">Category Names (comma-separated):</label>
            <input class="form-control" id="categoryNames" placeholder="Enter category names" type="text">
        </div>
        <button class="btn btn-lg btn-primary" type="submit">Filter Users</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>

    <!-- Results Table -->
    <table class="table table-striped" id="resultsTable">
        <thead>
        <tr>
            <th>User Type</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Balance</th>
            <th>Status</th>
            <th>Created At</th>
            <th>Updated At</th>
        </tr>
        </thead>
        <tbody>
        <!-- Filtered results will be appended here -->
        </tbody>
    </table>
</div>

<script>
    document.getElementById("filterUsersForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const userType = document.getElementById("userType").value;
        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const email = document.getElementById("email").value;
        const categoryNames = document.getElementById("categoryNames").value.split(",");

        try {
            const token = localStorage.getItem("jwtToken");
            if (!token) {
                displayMessage("Authentication token is missing. Please log in again.", "error");
                throw new Error("Token is missing");
            }

            const filterData = {
                userType: userType || null,
                firstName: firstName || null,
                lastName: lastName || null,
                email: email || null,
                categoryNames: categoryNames.filter(name => name.trim() !== "")
            };

            console.log("Submitting Filter Data:", filterData);

            const response = await fetch('http://localhost:8080/v1/users/filter-users?pageNumber=0&size=10&sortBy=firstName&sortDir=asc', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': '*/*'
                },
                body: JSON.stringify(filterData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error("Error filtering users:", errorData);
                throw new Error(errorData.message || "Failed to fetch filtered users.");
            }

            const users = await response.json();
            console.log("Filtered Users:", users);

            // Clear previous results
            const resultsTableBody = document.querySelector("#resultsTable tbody");
            resultsTableBody.innerHTML = "";

            // Populate table with results
            users.forEach(user => {
                const row = `
                    <tr>
                        <td>${user.userType}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.email}</td>
                        <td>${user.balance || 0}</td>
                        <td>${user.status}</td>
                        <td>${user.createdAt || "-"}</td>
                        <td>${user.updatedAt || "-"}</td>
                    </tr>
                `;
                resultsTableBody.innerHTML += row;
            });

            displayMessage("Users filtered successfully.", "success");
        } catch (error) {
            console.error("Filtering Error:", error);
            displayMessage(`Error: ${error.message}`, "error");
        }
    });

    function displayMessage(message, type) {
        const statusMessage = document.getElementById("statusMessage");
        statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
        statusMessage.textContent = message;
        statusMessage.classList.remove("d-none");
        setTimeout(() => {
            statusMessage.className = "status-message d-none";
            statusMessage.textContent = "";
        }, 3000);
    }
</script>
</body>
</html>
