<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Actions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator" id="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a class="current-page" href="/admin-actions.html">Admin Actions</a>
</div>

<!-- Buttons: Back and Forward -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
    <button class="forward-btn" onclick="navigateForward()">Forward</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    function navigateForward() {
        window.history.forward(); // حرکت به صفحه بعدی از تاریخچه مرورگر
    }
</script>

<!-- Title and Action Links -->
<div class="container mt-5 text-center">
    <h1 class="title">Admin Actions</h1>
    <p class="mt-3">Select an action below:</p>

    <!-- Action Buttons -->
    <div class="mt-5">
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToLogin()">Login Admin</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToSignup()">Signup Admin</button>
    </div>
</div>

<script>
    // مدیریت شرط‌ها و لینک‌ها در نویگیتور
    function navigateToLogin() {
        const navigator = document.getElementById('navigator');
        navigator.innerHTML = `
            <a href="/index.html">Home</a>
            <a href="/role-selection.html">Role Selection</a>
            <a href="/admin-actions.html">Admin Actions</a>
            <a href="/login-admin.html" class="current-page">Login Admin</a>
        `;
        window.location.href = '/login-admin.html'; // هدایت به صفحه لاگین ادمین
    }

    function navigateToSignup() {
        const navigator = document.getElementById('navigator');
        navigator.innerHTML = `
            <a href="/index.html">Home</a>
            <a href="/role-selection.html">Role Selection</a>
            <a href="/admin-actions.html">Admin Actions</a>
            <a href="/signup-admin.html" class="current-page">Signup Admin</a>
        `;
        window.location.href = '/signup-admin.html'; // هدایت به صفحه ثبت‌نام ادمین
    }
</script>
</body>
</html>
