<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Add Sub-Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a href="/category-management.html">Category Management</a>
    <a class="current-page" href="/add-subcategory.html">Add sub category</a>
</div>
<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/category-management.html"; // Navigate back to category management
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Add Sub-Category</h1>
    <form class="mt-4" id="sub-category-form" style="max-width: 50%; margin: 0 auto;">
        <div class="mb-3">
            <label class="form-label" for="subCategoryParentName">Parent Category:</label>
            <select class="form-control" id="subCategoryParentName">
                <option disabled selected value="">Select a Parent Category</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="subCategoryName">Sub-Category Name:</label>
            <input class="form-control" id="subCategoryName" placeholder="Enter Sub-Category Name" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="subCategoryDescription">Description:</label>
            <input class="form-control" id="subCategoryDescription" placeholder="Enter Description" required
                   type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="subCategoryBasePrice">Base Price:</label>
            <input class="form-control" id="subCategoryBasePrice" placeholder="Enter Base Price" required type="number">
        </div>
        <button class="btn btn-lg btn-main" id="addSubCategoryBtn" type="button">Add Sub-Category</button>
    </form>

    <div class="mt-4">
        <h3>Added Sub-Categories</h3>
        <ul id="addedSubCategoriesList" style="list-style-type: none; padding: 0;"></ul>
    </div>

    <!-- Status Message -->
    <div class="mt-3" id="status-message"></div>
</div>

<script>
    // Script to populate Parent Categories in dropdown
    document.addEventListener('DOMContentLoaded', () => {
        const parentCategorySelect = document.getElementById('subCategoryParentName');

        // Fetch Parent Categories from the database
        fetch('http://localhost:8080/v1/categories/main-categories', {
            method: 'GET',
            headers: {
                'Accept': '*/*'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch parent categories');
                }
                return response.json();
            })
            .then(categories => {
                // Populate the dropdown menu with parent categories
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.name; // Assign value for the option
                    option.textContent = category.name; // Display category name
                    parentCategorySelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error fetching parent categories:', error);
                const errorOption = document.createElement('option');
                errorOption.value = '';
                errorOption.textContent = 'Error loading categories';
                parentCategorySelect.appendChild(errorOption);
            });
    });

    document.getElementById('addSubCategoryBtn').addEventListener('click', () => {
        const subCategoryName = document.getElementById('subCategoryName').value.trim();
        const subCategoryDescription = document.getElementById('subCategoryDescription').value.trim();
        const subCategoryBasePrice = document.getElementById('subCategoryBasePrice').value.trim();
        const subCategoryParentName = document.getElementById('subCategoryParentName').value.trim();

        // Validation
        if (!subCategoryName || !subCategoryDescription || !subCategoryBasePrice || !subCategoryParentName) {
            document.getElementById('status-message').className = 'status-message status-error';
            document.getElementById('status-message').innerHTML = 'Please fill out all fields!';
            return;
        }

        // Add Sub-Category Logic
        fetch('http://localhost:8080/v1/categories/create-sub-category', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': '*/*'
            },
            body: JSON.stringify({
                name: subCategoryName,
                description: subCategoryDescription,
                basePrice: parseFloat(subCategoryBasePrice),
                parentName: subCategoryParentName
            })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to add sub-category: ${subCategoryName}`);
                }
                return response.json();
            })
            .then(() => {
                const li = document.createElement('li');
                li.textContent = `${subCategoryName} (Parent: ${subCategoryParentName})`;
                document.getElementById('addedSubCategoriesList').appendChild(li);

                document.getElementById('status-message').className = 'status-message status-success';
                document.getElementById('status-message').innerHTML = `Sub-category "${subCategoryName}" successfully added!`;
            })
            .catch(error => {
                document.getElementById('status-message').className = 'status-message status-error';
                document.getElementById('status-message').innerHTML = `Error: ${error.message}`;
            });

        // Clear input fields
        document.getElementById('subCategoryName').value = '';
        document.getElementById('subCategoryDescription').value = '';
        document.getElementById('subCategoryBasePrice').value = '';
        document.getElementById('subCategoryParentName').value = '';
    });
</script>
</body>
</html>
