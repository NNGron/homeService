<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Add SubCategory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/expert-actions.html">Expert Actions</a>
    <a class="current-page" href="/add-sub-category.html">Add SubCategory</a>
</div>

<!-- Back Button -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>
<script>
    function navigateBack() {
        window.history.back();
    }
</script>

<!-- Title and Form -->
<div class="container mt-5 text-center">
    <h1 class="title">Add SubCategory</h1>
    <form class="mt-4 mx-auto" id="add-sub-category-form" style="width: 50%;">
        <div class="form-group mt-3">
            <label for="main-category">Select Main Category:</label>
            <select class="form-control spring-dropdown" id="main-category">
                <option disabled selected value="">Select a Main Category</option>
            </select>
        </div>

        <div class="form-group mt-3">
            <label for="sub-category-name">SubCategory Name:</label>
            <input class="form-control" id="sub-category-name" maxlength="100" placeholder="Enter SubCategory Name"
                   required type="text">
        </div>

        <div class="form-group mt-3">
            <label for="sub-category-description">Description:</label>
            <textarea class="form-control" id="sub-category-description" maxlength="255" placeholder="Enter Description"
                      required></textarea>
        </div>

        <div class="form-group mt-3">
            <label for="base-price">Base Price:</label>
            <input class="form-control" id="base-price" min="0" placeholder="Enter Base Price" required step="0.01"
                   type="number">
        </div>

        <button class="btn btn-lg btn-main mt-3" type="submit">Add SubCategory</button>
    </form>

    <!-- Status Message -->
    <div class="mt-4 status-container">
        <div class="status-message" id="status-message"></div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const mainCategoryDropdown = document.getElementById("main-category");
        let existingSubCategories = [];

        // Fetch existing subcategories to prevent duplicates
        fetch('/v1/categories/sub-categories')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch subcategories");
                }
                return response.json();
            })
            .then(data => {
                existingSubCategories = data.map(subCategory => subCategory.name);
            })
            .catch(error => {
                console.error("Error fetching subcategories:", error);
            });

        // Fetch main categories from the backend
        fetch('/v1/categories/main-categories')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch main categories");
                }
                return response.json();
            })
            .then(data => {
                if (data.length === 0) {
                    mainCategoryDropdown.innerHTML = `<option value="" disabled>No categories available</option>`;
                } else {
                    data.forEach(category => {
                        const option = document.createElement("option");
                        option.value = category.name;
                        option.textContent = category.name;
                        mainCategoryDropdown.appendChild(option);
                    });
                }
            })
            .catch(error => {
                displayMessage(`Error loading categories: ${error.message}`, 'error');
            });

        const form = document.getElementById("add-sub-category-form");
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const subCategoryName = document.getElementById("sub-category-name").value.trim();

            if (existingSubCategories.includes(subCategoryName)) {
                displayMessage(`Duplicate error: SubCategory "${subCategoryName}" already exists!`, 'error');
                return;
            }

            const subCategoryData = {
                name: subCategoryName,
                description: document.getElementById("sub-category-description").value,
                basePrice: document.getElementById("base-price").value,
                parentName: mainCategoryDropdown.options[mainCategoryDropdown.selectedIndex]?.text
            };

            fetch('/v1/categories/create-sub-category', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(subCategoryData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to add SubCategory');
                    }
                    return response.json();
                })
                .then(data => {
                    displayMessage(`SubCategory "${data.name}" added successfully!`, 'success');
                    existingSubCategories.push(data.name); // Add new subcategory to the list
                })
                .catch(error => {
                    displayMessage(`Error adding SubCategory: ${error.message}`, 'error');
                });
        });

        function displayMessage(message, type) {
            const statusMessage = document.getElementById("status-message");
            statusMessage.className = `status-message ${type === 'success' ? 'status-success' : 'status-error'}`;
            statusMessage.innerHTML = message;

            // Automatically remove the message after 2 seconds
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.innerHTML = '';
            }, 2000);
        }
    });
</script>
</body>
</html>
