<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Role Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator" id="navigator">
    <a href="/index.html">Home</a>
    <a class="current-page" href="/role-selection.html">Role Selection</a>
</div>
<!-- Buttons: Back and Forward -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
    <button class="forward-btn" onclick="navigateForward()">Forward</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    function navigateForward() {
        window.history.forward(); // حرکت به صفحه بعدی از تاریخچه مرورگر
    }
</script>
<!-- Title -->
<div class="container text-center mt-5">
    <h1 class="title">Select Your Role</h1>
    <p class="mt-3">Click on a role to navigate to its actions page:</p>
</div>

<!-- Role Buttons -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <!-- Admin -->
        <div class="col-md-3 text-center role-box">
            <button class="btn btn-lg btn-main" onclick="selectRole('admin')">I am an Admin</button>
        </div>
        <!-- Customer -->
        <div class="col-md-3 text-center role-box">
            <button class="btn btn-lg btn-main" onclick="selectRole('customer')">I am a Customer</button>
        </div>
        <!-- Expert -->
        <div class="col-md-3 text-center role-box">
            <button class="btn btn-lg btn-main" onclick="selectRole('expert')">I am an Expert</button>
        </div>
    </div>
</div>

<script>
    // مدیریت انتخاب نقش و به‌روزرسانی نویگیتور
    function selectRole(role) {
        const navigator = document.getElementById('navigator');
        navigator.innerHTML = ''; // پاک کردن نویگیتور قبلی

        // لینک‌های جدید بر اساس نقش انتخاب‌شده
        const homeLink = '<a href="/index.html">Home</a>';
        const roleSelectionLink = '<a href="/role-selection.html">Role Selection</a>';
        let roleActionLink = '';

        // افزودن لینک‌های متناسب با نقش
        switch (role) {
            case 'admin':
                roleActionLink = '<a href="/admin-actions.html" class="current-page">Admin Actions</a>';
                break;
            case 'expert':
                roleActionLink = '<a href="/expert-actions.html" class="current-page">Expert Actions</a>';
                break;
            case 'customer':
                roleActionLink = '<a href="/customer-actions.html" class="current-page">Customer Actions</a>';
                break;
        }

        // بازسازی نویگیتور
        navigator.innerHTML = homeLink + roleSelectionLink + roleActionLink;

        // هدایت به صفحه مربوط به نقش
        switch (role) {
            case 'admin':
                window.location.href = '/admin-actions.html';
                break;
            case 'expert':
                window.location.href = '/expert-actions.html';
                break;
            case 'customer':
                window.location.href = '/customer-actions.html';
                break;
        }
    }
</script>
</body>
</html>
