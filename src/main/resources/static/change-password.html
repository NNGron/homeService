<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Update Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
            width: 50%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/profile-customer.html">Profile</a>
    <a class="current-page" href="/update-password.html">Update Password</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/profile-customer.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Update Password</h1>
    <p class="mt-3">Update your account password below:</p>

    <!-- Update Password Form -->
    <form id="updatePasswordForm">
        <div class="form-group">
            <label class="form-label" for="oldPassword">Old Password:</label>
            <input class="form-control" id="oldPassword" placeholder="Enter your old password" required type="password">
        </div>
        <div class="form-group">
            <label class="form-label" for="newPassword">New Password:</label>
            <input
                    class="form-control"
                    id="newPassword"
                    placeholder="Must contain at least 8 characters, a letter, and a number"
                    required
                    type="password">
        </div>
        <button class="btn btn-main btn-lg" type="submit">Update Password</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const updatePasswordForm = document.getElementById("updatePasswordForm");
        const statusMessage = document.getElementById("statusMessage");

        updatePasswordForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const oldPassword = document.getElementById("oldPassword").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();

            if (!oldPassword || !newPassword) {
                displayMessage("Both fields are required.", "error");
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/v1/users/update-password?email=customer1%40yahoo.com&oldPassword=${encodeURIComponent(oldPassword)}&newPassword=${encodeURIComponent(newPassword)}`, {
                    method: "PUT",
                    headers: {
                        "Accept": "*/*"
                    }
                });

                if (!response.ok) {
                    const errorResponse = await response.json();
                    throw new Error(errorResponse.message || "Failed to update password.");
                }

                const data = await response.json();
                displayMessage(data.message || "Password updated successfully.", "success");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
