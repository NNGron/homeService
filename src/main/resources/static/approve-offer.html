<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Approve Offer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .form-control {
            width: 50%; /* عرض input‌ها */
            margin: 0 auto; /* مرکزچینی */
        }

        .form-container {
            text-align: center;
            margin-top: 50px;
        }

        .btn-primary {
            margin-top: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 15px; /* فاصله از فرم */
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }

        .status-success {
            color: #155724;
        }

        .status-error {
            color: #721c24;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/approve-offer.html">Approve Offer</a>
</div>

<!-- Back Button -->
<button class="btn btn-secondary back-btn mt-3" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/order-management.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Approve Offer</h1>
    <p>Fill in the fields below to approve an offer:</p>
</div>

<!-- Approve Offer Form -->
<div class="form-container">
    <form id="approveOfferForm">
        <div class="mb-3">
            <label class="form-label" for="orderNumber">Order Number:</label>
            <input class="form-control" id="orderNumber" placeholder="Enter order number" required type="number">
        </div>
        <div class="mb-3">
            <label class="form-label" for="offerNumber">Offer Number:</label>
            <input class="form-control" id="offerNumber" placeholder="Enter offer number" required type="number">
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Submit</button>
    </form>

    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const approveOfferForm = document.getElementById("approveOfferForm");
        const statusMessage = document.getElementById("statusMessage");

        approveOfferForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const orderNumber = document.getElementById("orderNumber").value.trim();
            const offerNumber = document.getElementById("offerNumber").value.trim();

            if (!orderNumber || !offerNumber) {
                displayMessage("Order Number and Offer Number are required.", "error");
                return;
            }

            try {
                // ارسال درخواست PUT برای تایید سفارش
                const response = await fetch(`http://localhost:8080/v1/orders/update-status?email=customer1%40yahoo.com&password=customer1&status=WAITING_FOR_EXPERT_ARRIVAL&orderNumber=${orderNumber}&offerNumber=${offerNumber}`, {
                    method: "PUT",
                    headers: {
                        "Accept": "*/*"
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (errorData.errorCode === 63) {
                        // نمایش پیام خطا برای سفارش تایید شده
                        displayMessage(`Order Number ${orderNumber} with Offer Number ${offerNumber} is already approved.`, "error");
                    } else {
                        throw new Error(errorData.errorMessage || "Unknown error occurred.");
                    }
                } else {
                    const data = await response.json();
                    // پیام موفقیت برای تایید سفارش
                    displayMessage(`Order Number ${orderNumber} with Offer Number ${offerNumber} has been successfully approved with status Waiting for Expert Arrival.`, "success");
                }
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;

            // حذف پیام پس از ۳ ثانیه
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 3000);
        }
    });
</script>

</body>
</html>
