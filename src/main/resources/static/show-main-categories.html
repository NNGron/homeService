<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Show Main Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        td, th {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .table-container {
            width: 50%;
            margin: 30px auto;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/category-management.html">Category Management</a>
    <a class="current-page" href="/show-main-categories.html">Show Main Categories</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/category-management.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Main Categories</h1>
    <p class="mt-3">List of all main categories:</p>

    <!-- Categories Table -->
    <div class="table-container">
        <table class="table table-striped" style="font-size: 0.85rem; table-layout: fixed;">
            <thead>
            <tr>
                <th>Name</th>
            </tr>
            </thead>
            <tbody id="categoriesTableBody">
            <!-- اطلاعات دسته‌بندی‌ها به صورت داینامیک اینجا اضافه می‌شود -->
            </tbody>
        </table>
    </div>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const categoriesTableBody = document.getElementById("categoriesTableBody");
        const statusMessage = document.getElementById("statusMessage");

        try {
            // Fetching main categories from the backend
            const token = localStorage.getItem("jwtToken");
            const response = await fetch('http://localhost:8080/v1/categories/main-categories', {
                method: 'GET',
                headers: {
                    'Accept': '*/*',
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error("Failed to fetch main categories.");
            }

            const categories = await response.json();
            categoriesTableBody.innerHTML = ""; // Clear table

            if (categories.length === 0) {
                displayMessage("No main categories found.", "error");
                return;
            }

            // Populate the table with only category names
            categories.forEach(category => {
                const row = `
                <tr>
                    <td>${category.name}</td>
                </tr>
            `;
                categoriesTableBody.innerHTML += row;
            });

            displayMessage("Main categories loaded successfully.", "success");
        } catch (error) {
            displayMessage(`Error: ${error.message}`, "error");
        }

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
