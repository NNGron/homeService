<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Expert Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        /* تنظیم استایل دکمه‌ها */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* فاصله بین دکمه‌ها */
            margin-top: 30px;
        }

        .button-container button {
            width: 300px; /* عرض دکمه‌ها */
            height: 50px; /* ارتفاع دکمه‌ها */
            font-size: 16px; /* اندازه فونت دکمه‌ها */
            text-align: center;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/login-expert.html">Login</a>
    <a class="current-page" href="/expert-dashboard.html">Expert Dashboard</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/login-expert.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Expert Dashboard</h1>
    <p class="mt-3">Welcome! Choose an action below:</p>

    <!-- Action Buttons in Vertical Order -->
    <div class="button-container">
        <button class="btn btn-lg btn-main" onclick="navigateToProfileExpert()">Profile</button>
        <button class="btn btn-lg btn-main" onclick="navigateToManageOffers()">Manage Offers</button>
        <button class="btn btn-lg btn-main" onclick="navigateToShowEarnings()">Show Earnings</button>
        <button class="btn btn-lg btn-main" onclick="navigateToViewOrdersForExpert()">View Orders</button>
    </div>
</div>

<script>
    function navigateToProfileExpert() {
        window.location.href = "/profile-expert.html";
    }

    function navigateToManageOffers() {
        window.location.href = "/manage-offers.html";
    }

    function navigateToShowEarnings() {
        window.location.href = "/show-earnings.html";
    }

    function navigateToViewOrdersForExpert() {
        window.location.href = "/view-orders-for-expert.html";
    }
</script>
</body>
</html>
