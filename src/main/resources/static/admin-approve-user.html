<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Approve Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/login-admin.html">Admin Login</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/admin-approve-user.html">Approve User</a>
</div>
<!-- Buttons: Back -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>
<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }
</script>
<div class="container mt-5 text-center">
    <h1 class="title">Approve Users</h1>

    <!-- Buttons for Approving Customer or Expert -->
    <div class="mt-4">
        <button class="btn btn-main" id="approveCustomerBtn">Approve Customer</button>
        <button class="btn btn-main" id="approveExpertBtn">Approve Expert</button>
    </div>

    <!-- Email Input Section -->
    <div class="mt-4 d-none" id="emailSection">
        <label class="form-label" for="userEmail">Enter User Email:</label>
        <input class="form-control half-width" id="userEmail" placeholder="Enter user's email" type="email">
        <button class="btn btn-main mt-3" id="approveUserBtn">Approve User</button>
    </div>

    <!-- Status Message -->
    <div class="status-message mt-4" id="statusMessage"></div>
</div>

<script>
    let approvalType = ""; // Track which type of approval is selected

    // Event listener for "Approve Customer"
    document.getElementById('approveCustomerBtn').addEventListener('click', () => {
        approvalType = "CUSTOMER";
        document.getElementById('emailSection').classList.remove('d-none'); // Show email input
    });

    // Event listener for "Approve Expert"
    document.getElementById('approveExpertBtn').addEventListener('click', () => {
        approvalType = "EXPERT";
        document.getElementById('emailSection').classList.remove('d-none'); // Show email input
    });

    // Handle Approve User
    document.getElementById('approveUserBtn').addEventListener('click', () => {
        const userEmail = document.getElementById('userEmail').value.trim();

        if (!userEmail) {
            alert('Please enter a valid email address.');
            return;
        }

        // Make API call to approve the user
        fetch(`http://localhost:8080/v1/users/approve-user?email=${userEmail}`, {
            method: 'PUT',
            headers: {
                'accept': '*/*'
            }
        })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text);
                    });
                }
                return response.json();
            })
            .then(data => {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.className = 'status-message status-success';
                statusMessage.textContent = `User successfully approved as ${approvalType.toLowerCase()}!`;
                document.getElementById('emailSection').classList.add('d-none'); // Hide email input
                document.getElementById('userEmail').value = ""; // Clear email input
            })
            .catch(error => {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.className = 'status-message status-error';
                statusMessage.textContent = `Error: ${error.message}`;
            });
    });
</script>
</body>
</html>
