<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        /* استایل برای تنظیم دکمه‌ها به صورت عمودی */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* فاصله بین دکمه‌ها */
            margin-top: 30px;
        }

        .button-container button {
            width: 300px; /* عرض دکمه‌ها */
            height: 50px; /* ارتفاع دکمه‌ها */
            font-size: 16px; /* اندازه فونت دکمه‌ها */
            text-align: center;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/login-customer.html">Login</a>
    <a class="current-page" href="/customer-dashboard.html">Customer Dashboard</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/login-customer.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Customer Dashboard</h1>
    <p class="mt-3">Welcome! Choose an action below:</p>

    <!-- Action Buttons in Vertical Order -->
    <div class="button-container">
        <button class="btn btn-lg btn-main" onclick="navigateToProfileCustomer()">Profile</button>
        <button class="btn btn-lg btn-main" onclick="navigateToOrderManagement()">Order Management</button>
        <button class="btn btn-lg btn-main" onclick="navigateToShowCredit()">Show Credit</button>
    </div>
</div>

<script>
    function navigateToOrderManagement() {
        window.location.href = "/order-management.html";
    }

    function navigateToShowCredit() {
        window.location.href = "/show-credit.html";
    }

    function navigateToProfileCustomer() {
        window.location.href = "/profile-customer.html";
    }
</script>
</body>
</html>
