<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Delete Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a href="/category-management.html">Category Management</a>
    <a class="current-page" href="/add-subcategory.html">Add sub category</a>
</div>
<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/category-management.html"; // Navigate back to category management
    }
</script>
<div class="container mt-5 text-center">
    <h1 class="title">Delete Category</h1>

    <!-- Buttons for Sub and Main Category -->
    <div class="mt-4">
        <button class="btn btn-main" id="deleteSubCategoryBtn">Delete Sub-Category</button>
        <button class="btn btn-main" id="deleteMainCategoryBtn">Delete Main Category</button>
    </div>

    <!-- Dynamic Input for Sub-Category -->
    <div class="mt-4 d-none" id="subCategorySection">
        <label class="form-label" for="subCategoryName">Enter Sub-Category Name:</label>
        <input class="form-control half-width" id="subCategoryName" placeholder="Sub-Category Name" type="text">
        <button class="btn btn-danger mt-3" id="confirmDeleteSubCategoryBtn">Confirm Delete</button>
    </div>

    <!-- Dynamic Input for Main Category -->
    <div class="mt-4 d-none" id="mainCategorySection">
        <label class="form-label" for="mainCategoryName">Enter Main Category Name:</label>
        <input class="form-control half-width" id="mainCategoryName" placeholder="Main Category Name" type="text">
        <button class="btn btn-danger mt-3" id="confirmDeleteMainCategoryBtn">Confirm Delete</button>
    </div>

    <!-- Status Message -->
    <div class="mt-4" id="statusMessage"></div>
</div>

<script>
    // Function to get the token from localStorage
    function getToken() {
        const token = localStorage.getItem("jwtToken");
        if (!token) {
            alert("Authentication token is missing. Please log in again.");
            throw new Error("Token is missing");
        }
        return token;
    }

    // Show Sub-Category Section
    document.getElementById('deleteSubCategoryBtn').addEventListener('click', () => {
        document.getElementById('subCategorySection').classList.remove('d-none');
        document.getElementById('mainCategorySection').classList.add('d-none');
    });

    // Show Main Category Section
    document.getElementById('deleteMainCategoryBtn').addEventListener('click', () => {
        document.getElementById('mainCategorySection').classList.remove('d-none');
        document.getElementById('subCategorySection').classList.add('d-none');
    });

    // Handle Sub-Category Deletion
    document.getElementById('confirmDeleteSubCategoryBtn').addEventListener('click', async () => {
        const subCategoryName = document.getElementById('subCategoryName').value.trim();

        if (!subCategoryName) {
            alert('Please enter a Sub-Category Name.');
            return;
        }

        const token = getToken(); // Get the token

        try {
            const response = await fetch(`http://localhost:8080/v1/categories/delete-sub-category?subCategoryName=${subCategoryName}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`, // Send token in header
                    'Accept': '*/*'
                }
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.errorMessage || "Failed to delete sub-category");
            }

            const message = await response.text();
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = 'status-message status-success';
            statusMessage.textContent = message;
        } catch (error) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = 'status-message status-error';
            statusMessage.textContent = `Error: ${error.message}`;
        }
    });

    // Handle Main Category Deletion
    document.getElementById('confirmDeleteMainCategoryBtn').addEventListener('click', async () => {
        const mainCategoryName = document.getElementById('mainCategoryName').value.trim();

        if (!mainCategoryName) {
            alert('Please enter a Main Category Name.');
            return;
        }

        const token = getToken(); // Get the token

        try {
            const response = await fetch(`http://localhost:8080/v1/categories/delete-main-category?mainCategoryName=${mainCategoryName}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`, // Send token in header
                    'Accept': '*/*'
                }
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.errorMessage || "Failed to delete main-category");
            }

            const message = await response.text();
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = 'status-message status-success';
            statusMessage.textContent = message;
        } catch (error) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = 'status-message status-error';
            statusMessage.textContent = `Error: ${error.message}`;
        }
    });
</script>
</body>
</html>
