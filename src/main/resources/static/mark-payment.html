<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Get Final Price and Pay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .form-control {
            width: 40%;
            margin: 0 auto;
        }

        .form-container {
            text-align: center;
            margin-top: 50px;
        }

        .btn-primary {
            margin-top: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }

        .status-success {
            color: #155724;
        }

        .status-error {
            color: #721c24;
        }

        .status-info {
            color: #0c5460;
        }

        .final-price-container {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/get-final-price.html">Get Final Price</a>
</div>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Get Final Price and Pay</h1>
    <p>Enter order and offer numbers below:</p>
</div>

<!-- Final Price Form -->
<div class="form-container">
    <form id="priceForm">
        <div class="mb-3">
            <label class="form-label" for="orderNumber">Order Number:</label>
            <input class="form-control" id="orderNumber" placeholder="Enter order number" required type="number">
        </div>
        <div class="mb-3">
            <label class="form-label" for="offerNumber">Offer Number:</label>
            <input class="form-control" id="offerNumber" placeholder="Enter offer number" required type="number">
        </div>
        <div class="final-price-container" id="finalPriceContainer"></div>
        <button class="btn btn-primary btn-lg mt-4" disabled id="payButton" type="submit">Submit Payment</button>
    </form>
    <!-- Status Message -->
    <div id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const orderNumberInput = document.getElementById("orderNumber");
        const offerNumberInput = document.getElementById("offerNumber");
        const finalPriceContainer = document.getElementById("finalPriceContainer");
        const payButton = document.getElementById("payButton");
        const statusMessage = document.getElementById("statusMessage");

        // تابع برای دریافت قیمت نهایی و بررسی وضعیت پرداخت
        const fetchFinalPrice = () => {
            const orderNumber = orderNumberInput.value.trim();
            const offerNumber = offerNumberInput.value.trim();

            if (!orderNumber || !offerNumber) {
                finalPriceContainer.textContent = "";
                payButton.disabled = true;
                return;
            }

            // ارسال درخواست به سرور
            const token = localStorage.getItem("jwtToken");
            fetch(`http://localhost:8080/v1/customers/order-offers?email=customer1%40yahoo.com&password=customer1`, {
                method: "GET",
                headers: {
                    'Authorization': `Bearer ${token}`,
                    "Accept": "*/*"
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to fetch offers.");
                    }
                    return response.json();
                })
                .then(data => {
                    // پیدا کردن پیشنهاد مرتبط با orderNumber و offerNumber
                    const offer = data.find(
                        o => o.offerNumber == offerNumber && o.order.orderNumber == orderNumber
                    );

                    if (offer) {
                        if (offer.order.status === "PAID") {
                            finalPriceContainer.textContent = "";
                            payButton.disabled = true; // غیر فعال کردن دکمه پرداخت
                            displayMessage(`Order Number ${orderNumber} and Offer Number ${offerNumber} with Final Price ${offer.order.finalPrice} has already been paid.`, "error");
                        } else {
                            finalPriceContainer.textContent = `Final Price: ${offer.order.finalPrice}`;
                            payButton.disabled = false; // فعال کردن دکمه پرداخت
                        }
                    } else {
                        finalPriceContainer.textContent = "Final Price not available.";
                        payButton.disabled = true;
                    }
                })
                .catch(error => {
                    console.error(error);
                    finalPriceContainer.textContent = "Error fetching final price.";
                    payButton.disabled = true;
                });
        };

        // رویداد تغییر در فیلدهای شماره سفارش و شماره پیشنهاد
        orderNumberInput.addEventListener("input", fetchFinalPrice);
        offerNumberInput.addEventListener("input", fetchFinalPrice);

        // پردازش پرداخت
        const processPayment = (event) => {
            event.preventDefault();

            const orderNumber = orderNumberInput.value.trim();
            const offerNumber = offerNumberInput.value.trim();

            fetch(`http://localhost:8080/v1/orders/paid?email=customer1%40yahoo.com&password=customer1&orderNumber=${orderNumber}&offerNumber=${offerNumber}`, {
                method: "PUT",
                headers: {
                    "Accept": "*/*"
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Payment failed.");
                    }
                    return response.json();
                })
                .then(data => {
                    displayMessage(`Payment processed successfully for Order Number ${data.orderNumber}!`, "success");
                    setTimeout(() => {
                        window.location.href = "/order-management.html"; // انتقال به صفحه مدیریت سفارش‌ها
                    }, 2000);
                })
                .catch(error => {
                    displayMessage(`Error: ${error.message}`, "error");
                });
        };

        payButton.addEventListener("click", processPayment);

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 3000);
        }
    });
</script>
</body>
</html>
