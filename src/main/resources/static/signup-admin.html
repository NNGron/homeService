<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a class="current-page" href="/signup-admin.html">Sign Up</a>
</div>

<!-- Back Button -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    function showMessage(message, isSuccess = true) {
        const statusMessage = document.getElementById('status-message');
        statusMessage.className = isSuccess ? 'status-success status-message' : 'status-error status-message';
        statusMessage.innerHTML = message;
    }
</script>

<!-- Title and Form -->
<div class="container mt-5 text-center">
    <h1 class="title">Admin Sign Up</h1>
    <form class="mt-4" id="admin-signup-form">
        <div class="mb-3">
            <label class="form-label" for="userName">Username:</label>
            <input class="form-control" id="userName" placeholder="Enter username (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" id="password" placeholder="At least 8 characters, one letter, and one number"
                   required type="password">
        </div>
        <div class="mb-3">
            <label class="form-label" for="firstName">First Name:</label>
            <input class="form-control" id="firstName" placeholder="Enter first name (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="lastName">Last Name:</label>
            <input class="form-control" id="lastName" placeholder="Enter last name (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" id="email" placeholder="Enter a valid email address (required)" required
                   type="email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="address">Address:</label>
            <input class="form-control" id="address" placeholder="Enter address (required)" required type="text">
        </div>
        <button class="btn btn-lg btn-main" id="signup-btn" type="button">Sign Up</button>
    </form>
    <div class="mt-3" id="status-message"></div>
</div>

<script>
    document.getElementById('signup-btn').addEventListener('click', () => {
        const adminData = {
            userName: document.getElementById('userName').value,
            password: document.getElementById('password').value,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            userType: "ADMIN"
        };

        fetch('http://localhost:8080/v1/users/signup', {
            method: 'POST',
            headers: {
                'Accept': '*/*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(adminData)
        })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(errorData => {
                        throw new Error(errorData.errorMessage || 'An error occurred during signup.');
                    });
                }
                return response.json();
            })
            .then(data => {
                showMessage(`${data.message || 'Your account has been successfully created.'}`, true);
                setTimeout(() => {
                    window.location.href = "/login-admin.html"; // انتقال به صفحه ورود
                }, 3000);
            })
            .catch(error => {
                showMessage(`${error.message}`, false);
            });
    });
</script>
</body>
</html>
