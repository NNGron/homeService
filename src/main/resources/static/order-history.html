<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Order History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .form-control {
            width: 40%;
            margin: 0 auto;
        }

        .container {
            text-align: center;
            margin-top: 30px;
        }

        .orders-table {
            width: 70%;
            margin: 30px auto;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
        }

        .status-wrapper {
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            color: #0c5460;
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
        }

        th, td {
            text-align: center;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/order-history.html">Order History</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/order-management.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Order History</h1>
    <p>Your past orders are listed below:</p>
</div>

<!-- Order History Table -->
<div class="orders-table">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Order Number</th>
            <th>Order Description</th>
            <th>Order Date</th>
            <th>Execution Date</th>
            <th>Final Price</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody id="orderTableBody">
        <!-- Rows will be dynamically added here -->
        </tbody>
    </table>
</div>

<!-- Message Box -->
<div class="status-wrapper">
    <div class="status-message" id="statusMessage" style="display: none;"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const orderTableBody = document.getElementById("orderTableBody");
        const statusMessage = document.getElementById("statusMessage");

        try {
            const response = await fetch('http://localhost:8080/v1/orders/orders_history?email=customer1%40yahoo.com&password=customer1', {
                method: 'GET',
                headers: {
                    "Accept": "*/*"
                }
            });

            if (!response.ok) {
                throw new Error("Failed to fetch order history.");
            }

            const orders = await response.json();

            if (orders.length === 0) {
                displayMessage("You have no past orders to display.", "info");
            } else {
                orders.forEach(order => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${order.orderNumber}</td>
                        <td>${order.orderDescription}</td>
                        <td>${order.orderDate}</td>
                        <td>${order.executionDate}</td>
                        <td>${order.finalPrice ? order.finalPrice : "-"}</td> <!-- خط تیره در صورت نبود قیمت -->
                        <td>${order.status}</td>
                    `;
                    orderTableBody.appendChild(row);
                });

                displayMessage("Order history loaded successfully.", "success");
            }
        } catch (error) {
            displayMessage("Failed to load order history. Please try again later.", "error");
        }
    });

    function displayMessage(message, type) {
        const statusMessage = document.getElementById("statusMessage");
        statusMessage.className = `status-message status-${type}`;
        statusMessage.textContent = message;
        statusMessage.style.display = 'inline-block';

        setTimeout(() => {
            statusMessage.style.display = 'none';
            statusMessage.className = '';
            statusMessage.textContent = '';
        }, 2000);
    }
</script>
</body>
</html>
