<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Get Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        /* تنظیمات جلوگیری از چند خطی شدن متن‌ها */
        td, th {
            white-space: nowrap; /* جلوگیری از انتقال متن به خط بعدی */
            overflow: hidden; /* مخفی کردن محتوای اضافی */
            text-overflow: ellipsis; /* نمایش ... به جای متن اضافی */
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/get-users.html">Get Users</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center" style="width: 65%; margin: 0 auto;">
    <h1 class="title">All Users</h1>

    <div class="d-flex" style="gap: 10px;">
        <!-- User Table -->
        <div style="width: 70%;">
            <table class="table table-striped" style="font-size: 0.85rem; table-layout: fixed; width: 100%;">
                <thead>
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 15%;">User Type</th>
                    <th style="width: 15%;">First Name</th>
                    <th style="width: 15%;">Last Name</th>
                    <th style="width: 20%;">Email</th>
                    <th style="width: 15%;">Balance</th>
                    <th style="width: 15%;">Status</th>
                </tr>
                </thead>
                <tbody id="userTableBody">
                <!-- Dynamic user rows will be appended here -->
                </tbody>
            </table>
        </div>

        <!-- Dates Table -->
        <div style="width: 30%;">
            <table class="table table-striped" style="font-size: 0.85rem; width: 100%; border-spacing: 24px 0;">
                <!-- فاصله بین ستون‌ها به صورت افقی -->
                <thead>
                <tr>
                    <th style="width: 50%; padding-right: 20px; text-align: left;">Created At</th>
                    <th style="width: 50%; padding-left: 20px; text-align: left;">Updated At</th>
                </tr>
                </thead>
                <tbody id="datesTableBody">
                <!-- Dynamic date rows will be appended here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Status Message -->
    <div class="mt-4" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const statusMessage = document.getElementById("statusMessage");

        // Retrieve token from localStorage
        function getToken() {
            const token = localStorage.getItem("jwtToken");
            if (!token) {
                displayMessage("Authentication token is missing. Please log in again.", "error");
                throw new Error("Token is missing");
            }
            return token;
        }

        // Display message helper
        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;

            // Automatically remove the message after 2 seconds
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 2000);
        }

        try {
            const token = getToken(); // Retrieve token

            // Fetch users from the backend
            const response = await fetch('http://localhost:8080/v1/users/all-user?pageNumber=0&size=10&sortBy=firstName&sortDir=asc', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`, // Add token to Authorization header
                    'Accept': '*/*'
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                if (errorData.errorCode === 401 && errorData.errorMessage === "Invalid token") {
                    alert("Your session has expired or your token is invalid. Please log in again.");
                    window.location.href = "/login-admin.html"; // Redirect to login
                }
                throw new Error(errorData.errorMessage || "An error occurred while fetching users.");
            }

            const users = await response.json();
            const userTableBody = document.getElementById("userTableBody");
            const datesTableBody = document.getElementById("datesTableBody");

            userTableBody.innerHTML = ""; // Clear user table
            datesTableBody.innerHTML = ""; // Clear dates table

            if (users.length === 0) {
                displayMessage("No users found!", "error");
                return;
            }

            users.forEach((user, index) => {
                const userRow = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${user.userType || "N/A"}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.email}</td>
                        <td>${user.balance || 0}</td>
                        <td>${user.status}</td>
                    </tr>
                `;

                const datesRow = `
                    <tr>
                        <td>${user.createdAt || "N/A"}</td>
                        <td>${user.updatedAt || "N/A"}</td>
                    </tr>
                `;

                userTableBody.innerHTML += userRow;
                datesTableBody.innerHTML += datesRow;
            });

            displayMessage("Users fetched successfully!", "success");
        } catch (error) {
            displayMessage(`Error fetching users: ${error.message}`, "error");
        }
    });
</script>
</body>
</html>
