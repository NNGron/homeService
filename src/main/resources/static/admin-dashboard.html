<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .button-container {
            display: flex; /* استفاده از Flexbox */
            flex-direction: column; /* نمایش دکمه‌ها به صورت ستونی */
            align-items: center; /* دکمه‌ها در مرکز بخش قرار می‌گیرند */
            gap: 15px; /* فاصله بین دکمه‌ها */
            margin-top: 20px; /* فاصله کل بخش از بالای صفحه */
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a class="current-page" href="/admin-dashboard.html">Admin Dashboard</a>
</div>

<!-- Buttons: Back and Forward -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
    <button class="forward-btn" onclick="navigateForward()">Forward</button>
</div>

<script>
    function navigateBack() {
        window.history.back();
    }

    function navigateForward() {
        window.history.forward();
    }
</script>

<div class="container mt-5 text-center">
    <h1 class="title">Admin Dashboard</h1>
    <p class="mt-3">Welcome to the admin panel. Select an action below:</p>

    <div class="button-container"> <!-- تنظیم جدید کلاس برای نمایش دکمه‌ها به صورت ستونی -->
        <button class="btn btn-lg btn-main" onclick="navigateToApproveUser()">Approve Users</button>
        <button class="btn btn-lg btn-main" onclick="navigateToGetUsers()">Get All Users</button>
        <button class="btn btn-lg btn-main" onclick="navigateToGetAllFilterUsers()">Get All Filter Users</button>
        <button class="btn btn-lg btn-main" onclick="navigateToAddCredit()">Add Credit</button>
        <button class="btn btn-lg btn-main" onclick="navigateToCategoryManagement()">Manage Categories</button>
        <button class="btn btn-lg btn-main" onclick="navigateToAddCategoryToExpert()">Add Category To Expert</button>
        <button class="btn btn-lg btn-main" onclick="navigateToDeletedCategoryFromExpert()">Deleted Category From Expert</button>
        <button class="btn btn-lg btn-main" onclick="navigateToFilterComprehensiveOrders()">Filter Comprehensive Orders</button>
    </div>
</div>

<script>
    function navigateToFilterComprehensiveOrders() {
        window.location.href = "/filter-comprehensive-orders.html";
    }
    function navigateToGetAllFilterUsers() {
        window.location.href = "/get-all-filter-users.html";
    }
    function navigateToAddCredit() {
        window.location.href = "/add-credit.html";
    }
    function navigateToCategoryManagement() {
        window.location.href = "/category-management.html";
    }

    function navigateToDeletedCategoryFromExpert() {
        window.location.href = "/deleted-category-from-expert.html";
    }

    function navigateToAddCategoryToExpert() {
        window.location.href = "/add-category-to-expert.html";
    }

    function navigateToApproveUser() {
        window.location.href = "/admin-approve-user.html";
    }

    function navigateToGetUsers() {
        window.location.href = "/get-users.html";
    }
</script>
</body>
</html>
