<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a class="current-page" href="/admin-dashboard.html">Dashboard</a>
</div>

<!-- Buttons: Back and Forward -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
    <button class="forward-btn" onclick="navigateForward()">Forward</button>
</div>

<script>
    // عملکرد دکمه Back
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی از تاریخچه مرورگر
    }

    // عملکرد دکمه Forward
    function navigateForward() {
        window.history.forward(); // حرکت به صفحه بعدی از تاریخچه مرورگر
    }
</script>

<div class="container mt-5 text-center">
    <h1 class="title">Admin Dashboard</h1>
    <p class="mt-3">Welcome to the admin panel. Select an action below:</p>

    <div class="mt-5">
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToCategoryManagement()">Manage Categories</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToUserApproval()">Approve Users</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToGetUsers()">Get All Users</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToAddBalance()">Add Balance to Customer</button>
    </div>
</div>

<script>
    function navigateToCategoryManagement() {
        window.location.href = "/category-management.html";
    }

    function navigateToUserApproval() {
        window.location.href = "/user-approval.html";
    }

    function navigateToGetUsers() {
        window.location.href = "/get-users.html";
    }

    function navigateToAddBalance() {
        window.location.href = "/add-balance.html";
    }
</script>
</body>
</html>
