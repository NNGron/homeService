<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Profile Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
            width: 50%;
        }

        .btn-group {
            margin-top: 20px;
        }

        .btn-option {
            margin: 10px 5px;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/customer-dashboard.html">Customer Dashboard</a>
    <a class="current-page" href="/profile-customer.html">Profile</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/customer-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Profile</h1>
    <p class="mt-3">Manage and view your account details:</p>

    <!-- Buttons Section -->
    <div class="btn-group">
        <button class="btn btn-main btn-option" onclick="navigateToPersonalCustomerInfo()">Personal Information</button>
        <button class="btn btn-main btn-option" onclick="navigateToChangePassword()">Change Password</button>
        <button class="btn btn-main btn-option" onclick="navigateToChangeAddress()">Change Address</button>
        <button class="btn btn-main btn-option" onclick="navigateToDeleteAccount()">Delete Account</button>
    </div>
</div>

<script>
    function navigateToChangePassword() {
        window.location.href = "/change-password.html";
    }

    function navigateToChangeAddress() {
        window.location.href = "/change-address.html";
    }

    function navigateToPersonalCustomerInfo() {
        window.location.href = "/personal-customer-info.html";
    }

    function navigateToDeleteAccount() {
        window.location.href = "/delete-customer-account.html";
    }
</script>
</body>

</html>
