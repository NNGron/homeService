<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sort Offers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .form-control {
            width: 40%;
            margin: 0 auto;
        }

        .container {
            text-align: center;
            margin-top: 30px;
        }

        .btn-sort {
            margin-top: 20px;
        }

        .offers-table {
            width: 70%; /* عرض جدول */
            margin: 30px auto;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
        }

        .status-success {
            color: #155724;
        }

        .status-error {
            color: #721c24;
        }

        .status-info {
            color: #0c5460;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/sort-offers.html">Sort Offers</a>
</div>

<!-- Title -->
<div class="container">
    <h1 class="title">Sort Offers</h1>
    <p>Select sorting criteria and direction:</p>

    <!-- Sorting Form -->
    <form id="sortingForm">
        <div class="form-group mt-3">
            <label class="form-label" for="sortBy">Sort By:</label>
            <select class="form-control" id="sortBy" required>
                <option value="proposedPrice">Proposed Price</option>
                <option value="expert.rating">Expert Rating</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="sortDir">Sort Direction:</label>
            <select class="form-control" id="sortDir" required>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
        </div>
        <button class="btn btn-primary btn-sort" type="submit">Sort Offers</button>
    </form>

    <!-- Status Message -->
    <div id="statusMessage"></div>
</div>

<!-- Offers Table -->
<div class="offers-table">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th>Offer Number</th>
            <th>Order Number</th> <!-- اضافه کردن ستون Order Number -->
            <th>Expert Name</th>
            <th>Expert Email</th>
            <th>Proposed Price</th>
            <th>Estimated Time</th>
            <th>Expert Rating</th>
        </tr>
        </thead>
        <tbody id="offersTableBody">
        <!-- پیشنهادات به‌صورت داینامیک اینجا اضافه می‌شوند -->
        </tbody>
    </table>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const sortingForm = document.getElementById("sortingForm");
        const offersTableBody = document.getElementById("offersTableBody");
        const statusMessage = document.getElementById("statusMessage");

        sortingForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const sortBy = document.getElementById("sortBy").value;
            const sortDir = document.getElementById("sortDir").value;

            // ارسال درخواست GET به سرور برای مرتب‌سازی پیشنهادات
            fetch(`http://localhost:8080/v1/customers/order-offers?email=customer1%40yahoo.com&password=customer1&pageNumber=0&size=10&sortBy=${sortBy}&sortDir=${sortDir}`, {
                method: "GET",
                headers: {
                    "Accept": "*/*"
                }
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorResponse => {
                            throw new Error(errorResponse.errorMessage || "An unknown error occurred");
                        });
                    }
                    return response.json();
                })
                .then(offers => {
                    offersTableBody.innerHTML = ""; // خالی کردن جدول

                    if (offers.length === 0) {
                        displayMessage("No offers found!", "info");
                        return;
                    }

                    // افزودن پیشنهادات به جدول
                    offers.forEach((offer, index) => {
                        const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${offer.offerNumber}</td> <!-- شماره پیشنهاد -->
                            <td>${offer.order.orderNumber}</td> <!-- شماره سفارش -->
                            <td>${offer.expertName || "N/A"}</td>
                            <td>${offer.expertEmail || "N/A"}</td>
                            <td>${offer.proposedPrice || "N/A"}</td>
                            <td>${offer.estimatedTime || "N/A"}</td>
                            <td>${offer.expertRating !== null && offer.expertRating !== undefined ? offer.expertRating : "-"}</td>
                        </tr>
                    `;
                        offersTableBody.innerHTML += row;
                    });

                    displayMessage("Offers sorted successfully!", "success");
                })
                .catch(error => {
                    displayMessage(`Error: ${error.message}`, "error");
                });
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : type === "error" ? "status-error" : "status-info"}`;
            statusMessage.textContent = message;

            // حذف پیام پس از ۳ ثانیه
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 3000);
        }
    });
</script>
</body>
</html>
