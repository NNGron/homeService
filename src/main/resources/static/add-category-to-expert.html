<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Add Subcategories to Expert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
            width: 50%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .category-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .category-item {
            cursor: pointer;
            padding: 10px;
            background-color: #fff;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .category-item:hover {
            background-color: #e9ecef;
        }
        .selected-category {
            background-color: #cce5ff;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/add-category-to-expert.html">Add Subcategories to Expert</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Add Subcategories to Expert</h1>
    <p class="mt-3">Select subcategories from the list below to add to the expert:</p>

    <!-- Form -->
    <form id="addSubcategoryForm">
        <div class="form-group">
            <label class="form-label" for="expertEmail">Expert Email:</label>
            <input class="form-control" id="expertEmail" placeholder="Enter expert's email" required type="email">
        </div>

        <!-- Category List -->
        <div class="category-list" id="categoryList">
            <!-- Categories will be dynamically added here -->
        </div>

        <button class="btn btn-lg btn-primary" type="submit">Add Selected Subcategories</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const categoryList = document.getElementById("categoryList");
        const addSubcategoryForm = document.getElementById("addSubcategoryForm");
        const statusMessage = document.getElementById("statusMessage");
        let selectedCategories = [];

        // Fetch subcategories and populate the list
        async function loadSubcategories() {
            try {
                const token = localStorage.getItem("jwtToken");
                if (!token) {
                    displayMessage("Authentication token is missing. Please log in again.", "error");
                    throw new Error("Token is missing");
                }
                console.log("Fetching Subcategories with Token:", token);
                const response = await fetch('http://localhost:8080/v1/categories/sub-categories', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("Error fetching subcategories:", errorData);
                    throw new Error(errorData.message || "Failed to fetch subcategories.");
                }

                const subcategories = await response.json();
                console.log("Fetched Subcategories:", subcategories);
                categoryList.innerHTML = "";
                subcategories.forEach(subcategory => {
                    const categoryItem = document.createElement("div");
                    categoryItem.className = "category-item";
                    categoryItem.textContent = subcategory.name;
                    categoryItem.onclick = () => toggleCategorySelection(subcategory, categoryItem);
                    categoryList.appendChild(categoryItem);
                });
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        }

        // Toggle category selection
        function toggleCategorySelection(category, categoryItem) {
            const index = selectedCategories.findIndex(c => c.name === category.name);
            if (index === -1) {
                selectedCategories.push(category);
                categoryItem.classList.add("selected-category");
            } else {
                selectedCategories.splice(index, 1);
                categoryItem.classList.remove("selected-category");
            }
        }

        // Submit selected categories to the expert
        addSubcategoryForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const expertEmail = document.getElementById("expertEmail").value.trim();
            if (!expertEmail || selectedCategories.length === 0) {
                displayMessage("Please fill in all fields and select at least one category.", "error");
                return;
            }
            try {
                const selectedCategoryNames = selectedCategories.map(category => category.name);
                console.log("Submitting Data:", { expertEmail, subcategories: selectedCategoryNames });
                const token = localStorage.getItem("jwtToken");
                if (!token) {
                    displayMessage("Authentication token is missing. Please log in again.", "error");
                    throw new Error("Token is missing");
                }
                // Send expertEmail as query parameter and the JSON body as the array of strings.
                const url = `http://localhost:8080/v1/admin/add-expert-subcategories?expertEmail=${encodeURIComponent(expertEmail)}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(selectedCategoryNames)
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("Error adding subcategories:", errorData);
                    throw new Error(errorData.message || "Failed to add subcategories to expert.");
                }
                console.log("Subcategories Added Successfully.");
                displayMessage("Subcategories added successfully.", "success");
                selectedCategories = [];
                categoryList.querySelectorAll(".selected-category").forEach(item => item.classList.remove("selected-category"));
            } catch (error) {
                console.error("Submission Error:", error);
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }

        loadSubcategories();
    });
</script>
</body>
</html>
