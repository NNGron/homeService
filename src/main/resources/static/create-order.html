<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map {
            height: 400px;
            width: 50%;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .form-control {
            width: 50%;
            margin: 0 auto;
        }
        .status-message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/create-order.html">Create Order</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/order-management.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Create Order</h1>
    <p class="mt-3">Fill out the form below to create your order:</p>

    <!-- Order Form -->
    <form id="createOrderForm">
        <div class="form-group mt-3">
            <label for="mainCategory">Main Category:</label>
            <select id="mainCategory" class="form-control" required>
                <option value="" disabled selected>Select Main Category</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="subCategory">Sub Category:</label>
            <select id="subCategory" class="form-control" required>
                <option value="" disabled selected>Select Sub Category</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="offerCustomerPrice">Proposed Service Price:</label>
            <input type="number" id="offerCustomerPrice" class="form-control" placeholder="Enter your proposed price" required step="0.01" min="0">
        </div>
        <div class="form-group mt-3">
            <label for="orderDate">Order Date:</label>
            <input type="date" id="orderDate" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label for="executionDate">Execution Date:</label>
            <input type="date" id="executionDate" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label for="orderDescription">Order Description:</label>
            <textarea id="orderDescription" class="form-control" placeholder="Describe the order" required></textarea>
        </div>
        <div class="form-group mt-3">
            <label for="orderAddress">Order Address:</label>
            <input type="text" id="orderAddress" class="form-control" placeholder="Enter order address" required>
        </div>

        <!-- Hidden Inputs for Latitude and Longitude -->
        <input type="hidden" id="latitude" name="latitude" value="35.6892">
        <input type="hidden" id="longitude" name="longitude" value="51.3890">
    </form>

    <!-- Map Section -->
    <div id="map"></div>

    <!-- Submit Button -->
    <button type="submit" form="createOrderForm" class="btn btn-primary btn-lg mt-4">Submit Order</button>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const mainCategoryDropdown = document.getElementById("mainCategory");
        const subCategoryDropdown = document.getElementById("subCategory");
        const addressInput = document.getElementById("orderAddress");

        const token = localStorage.getItem("jwtToken");

        if (!token) {
            alert("Authentication token is missing. Please log in.");
            window.location.href = "/login.html";
            return;
        }

        // Fetch Main Categories
        fetch("http://localhost:8080/v1/categories/main-categories", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Error fetching main categories: ${response.statusText}`);
                }
                return response.json();
            })
            .then(categories => {
                categories.forEach(category => {
                    const option = document.createElement("option");
                    option.value = category.name;
                    option.textContent = category.name;
                    mainCategoryDropdown.appendChild(option);
                });
            })
            .catch(error => {
                console.error("Error fetching main categories:", error);
                displayMessage(`Error fetching main categories: ${error.message}`, "error");
            });

        // Update Subcategories based on Main Category Selection
        mainCategoryDropdown.addEventListener("change", () => {
            const selectedMainCategory = mainCategoryDropdown.value;
            subCategoryDropdown.innerHTML = '<option value="" disabled selected>Select Sub Category</option>';

            fetch("http://localhost:8080/v1/categories/sub-categories", {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error fetching subcategories: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(subCategories => {
                    const filteredSubCategories = subCategories.filter(
                        subCategory => subCategory.parentCategory?.name === selectedMainCategory
                    );
                    filteredSubCategories.forEach(subCategory => {
                        const option = document.createElement("option");
                        option.value = subCategory.name;
                        option.textContent = subCategory.name;
                        subCategoryDropdown.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error("Error fetching subcategories:", error);
                    displayMessage(`Error fetching subcategories: ${error.message}`, "error");
                });
        });

        // نقشه Leaflet
        const defaultLat = 35.6892;
        const defaultLng = 51.3890;

        const map = L.map('map').setView([defaultLat, defaultLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const marker = L.marker([defaultLat, defaultLng], {draggable: true}).addTo(map);

        document.getElementById('latitude').value = defaultLat;
        document.getElementById('longitude').value = defaultLng;

        function fetchAddressFromCoordinates(lat, lng) {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.display_name) {
                        addressInput.value = data.display_name;
                    } else {
                        addressInput.value = "Address not found";
                    }
                })
                .catch(error => {
                    console.error("Error fetching address:", error);
                    addressInput.value = "Error fetching address";
                });
        }

        function fetchCoordinatesFromAddress(address) {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        marker.setLatLng([lat, lon]);
                        map.setView([lat, lon], 13);
                        document.getElementById('latitude').value = lat;
                        document.getElementById('longitude').value = lon;
                    } else {
                        alert("Coordinates not found for the provided address.");
                    }
                })
                .catch(error => {
                    console.error("Error fetching coordinates:", error);
                    alert("Error fetching coordinates for the address.");
                });
        }

        marker.on('dragend', function () {
            const latlng = marker.getLatLng();
            document.getElementById('latitude').value = latlng.lat;
            document.getElementById('longitude').value = latlng.lng;
            fetchAddressFromCoordinates(latlng.lat, latlng.lng);
        });

        map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            document.getElementById('latitude').value = e.latlng.lat;
            document.getElementById('longitude').value = e.latlng.lng;
            fetchAddressFromCoordinates(e.latlng.lat, e.latlng.lng);
        });

        addressInput.addEventListener("change", () => {
            const address = addressInput.value.trim();
            if (address) {
                fetchCoordinatesFromAddress(address);
            }
        });

        document.getElementById("createOrderForm").addEventListener("submit", (event) => {
            event.preventDefault();

            const mainCategoryName = document.getElementById("mainCategory").value;
            const subCategoryName = document.getElementById("subCategory").value;
            const offerCustomerPrice = parseFloat(document.getElementById("offerCustomerPrice").value.trim());
            const orderDate = document.getElementById("orderDate").value.trim();
            const executionDate = document.getElementById("executionDate").value.trim();
            const orderDescription = document.getElementById("orderDescription").value.trim();
            const orderAddress = document.getElementById("orderAddress").value.trim();
            const latitude = document.getElementById("latitude").value;
            const longitude = document.getElementById("longitude").value;

            fetch("http://localhost:8080/v1/orders/create-order", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    mainCategoryName,
                    subCategoryName,
                    offerCustomerPrice,
                    orderDate,
                    executionDate,
                    orderDescription,
                    orderAddress,
                    latitude,
                    longitude
                })

            })
                .then(data => {
                    displayMessage("Order created successfully!", "success");
                    setTimeout(() => {
                        window.location.href = "http://localhost:8080/order-management.html";
                    }, 3000);
                })
                .catch(async error => {
                    let finalMessage = "An unknown error occurred.";
                    if (error instanceof Error) {
                        try {
                            const errJson = JSON.parse(error.message);
                            finalMessage = `❌ Error: ${errJson.errorMessage || errJson.message || error.message}`;
                        } catch {
                            finalMessage = `❌ Error: ${error.message}`;
                        }
                    } else {
                        finalMessage = `❌ Error: ${await error.text()}`;
                    }
                    displayMessage(finalMessage, "error");
                });

        });

        function displayMessage(message, type) {
            const statusMessage = document.getElementById("statusMessage");

            // پاکسازی کلاس‌ها
            statusMessage.classList.remove("text-success", "text-danger");
            statusMessage.classList.add(type === "success" ? "text-success" : "text-danger");

            // پیام را تنظیم و نمایش بده
            statusMessage.textContent = message;
            statusMessage.style.display = "block";

            // بعد از چند ثانیه مخفیش کن
            setTimeout(() => {
                statusMessage.style.display = "none";
            }, 3000);
        }

    });
</script>
</body>
</html>
