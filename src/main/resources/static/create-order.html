<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Create Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .form-control {
            width: 50%; /* عرض input‌ها و Dropdown‌ها */
            margin: 0 auto; /* مرکزچینی */
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/create-order.html">Create Order</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/order-management.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Create Order</h1>
    <p class="mt-3">Fill out the form below to create your order:</p>

    <!-- Order Form -->
    <form class="mt-4" id="createOrderForm">
        <div class="form-group mt-3">
            <label class="form-label" for="mainCategory">Main Category:</label>
            <select class="form-control" id="mainCategory" required>
                <option disabled selected value="">Select Main Category</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="subCategory">Sub Category:</label>
            <select class="form-control" id="subCategory" required>
                <option disabled selected value="">Select Sub Category</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="offerCustomerPrice">Proposed Service Price:</label>
            <input class="form-control" id="offerCustomerPrice" min="0" placeholder="Enter your proposed price"
                   required step="0.01" type="number">
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="orderDate">Order Date:</label>
            <input class="form-control" id="orderDate" required type="date">
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="executionDate">Execution Date:</label>
            <input class="form-control" id="executionDate" required type="date">
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="orderDescription">Order Description:</label>
            <textarea class="form-control" id="orderDescription" placeholder="Describe the order" required></textarea>
        </div>
        <div class="form-group mt-3">
            <label class="form-label" for="orderAddress">Order Address:</label>
            <input class="form-control" id="orderAddress" placeholder="Enter order address" required type="text">
        </div>
        <button class="btn btn-lg btn-primary mt-4" type="submit">Submit Order</button>
    </form>

    <!-- Status Message -->
    <div class="mt-4" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const mainCategoryDropdown = document.getElementById("mainCategory");
        const subCategoryDropdown = document.getElementById("subCategory");
        const createOrderForm = document.getElementById("createOrderForm");

        // Fetch Main Categories
        fetch("http://localhost:8080/v1/categories/main-categories")
            .then(response => response.json())
            .then(categories => {
                categories.forEach(category => {
                    const option = document.createElement("option");
                    option.value = category.name;
                    option.textContent = category.name;
                    mainCategoryDropdown.appendChild(option);
                });
            })
            .catch(error => {
                displayMessage(`Error fetching main categories: ${error.message}`, "error");
            });

        // Update Subcategories based on Main Category Selection
        mainCategoryDropdown.addEventListener("change", () => {
            const selectedMainCategory = mainCategoryDropdown.value;

            // Clear previous subcategories
            subCategoryDropdown.innerHTML = '<option value="" disabled selected>Select Sub Category</option>';

            // Fetch Subcategories
            fetch("http://localhost:8080/v1/categories/sub-categories")
                .then(response => response.json())
                .then(subCategories => {
                    const filteredSubCategories = subCategories.filter(
                        subCategory => subCategory.parentCategory?.name === selectedMainCategory
                    );

                    filteredSubCategories.forEach(subCategory => {
                        const option = document.createElement("option");
                        option.value = subCategory.name;
                        option.textContent = subCategory.name;
                        subCategoryDropdown.appendChild(option);
                    });
                })
                .catch(error => {
                    displayMessage(`Error fetching subcategories: ${error.message}`, "error");
                });
        });

        // Form Submit
        createOrderForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const mainCategoryName = document.getElementById("mainCategory").value;
            const subCategoryName = document.getElementById("subCategory").value;
            const offerCustomerPrice = document.getElementById("offerCustomerPrice").value.trim();
            const orderDate = document.getElementById("orderDate").value.trim();
            const executionDate = document.getElementById("executionDate").value.trim();
            const orderDescription = document.getElementById("orderDescription").value.trim();
            const orderAddress = document.getElementById("orderAddress").value.trim();

            // Send POST request
            fetch("http://localhost:8080/v1/orders/create-order?email=customer1%40yahoo.com&password=customer1", {
                method: "POST",
                headers: {
                    "Accept": "*/*",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    mainCategoryName: mainCategoryName,
                    subCategoryName: subCategoryName,
                    offerCustomerPrice: parseFloat(offerCustomerPrice),
                    orderDate: orderDate,
                    orderDescription: orderDescription,
                    executionDate: executionDate,
                    orderAddress: orderAddress
                })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(errorResponse => {
                            throw new Error(errorResponse.errorMessage || "An unknown error occurred");
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    displayMessage(`Order created successfully! Order Number: ${data.orderNumber}`, "success");

                    // Redirect to Order Management page
                    setTimeout(() => {
                        window.location.href = "/order-management.html";
                    }, 2000);
                })
                .catch(error => {
                    displayMessage(`Error: ${error.message}`, "error");
                });
        });

        function displayMessage(message, type) {
            const statusMessage = document.getElementById("statusMessage");
            statusMessage.className = `status-message ${type === "success" ? "text-success" : "text-danger"}`;
            statusMessage.textContent = message;

            // Remove message after 3 seconds
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 3000);
        }
    });
</script>
</body>
</html>
