<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Customer Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/customer-actions.html">Customer Actions</a>
    <a class="current-page" href="/signup-customer.html">Sign Up</a>
</div>

<!-- Buttons: Back -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }
</script>

<!-- Title and Form -->
<div class="container mt-5 text-center">
    <h1 class="title">Customer Sign Up</h1>
    <form class="mt-4" id="customer-signup-form">
        <div class="mb-3">
            <label class="form-label" for="userName">Username:</label>
            <input class="form-control" id="userName" placeholder="Enter username (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" id="password" placeholder="At least 8 characters, one letter, and one number"
                   required type="password">
        </div>
        <div class="mb-3">
            <label class="form-label" for="firstName">First Name:</label>
            <input class="form-control" id="firstName" placeholder="Enter first name (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="lastName">Last Name:</label>
            <input class="form-control" id="lastName" placeholder="Enter last name (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" id="email" placeholder="Enter a valid email address (required)" required
                   type="email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="address">Address:</label>
            <input class="form-control" id="address" placeholder="Enter address (required)" required type="text">
        </div>
        <button class="btn btn-lg btn-main" id="signup-btn" type="button">Sign Up</button>
    </form>
    <div class="mt-3" id="status-message"></div>
</div>

<script>
    document.getElementById('signup-btn').addEventListener('click', () => {
        const userName = document.getElementById('userName').value;
        const password = document.getElementById('password').value;
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const email = document.getElementById('email').value;
        const address = document.getElementById('address').value;

        const customerData = {
            userName,
            password,
            firstName,
            lastName,
            email,
            address,
            userType: "CUSTOMER"
        };

        fetch('http://localhost:8080/v1/users/signup', {
            method: 'POST',
            headers: {
                'Accept': '*/*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(customerData)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to sign up');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('status-message').innerHTML = `<div class="alert alert-success">Welcome, Customer ${data.firstName}! Your account has been successfully created.</div>`;
                setTimeout(() => {
                    window.location.href = "/login-customer.html"; // Redirect to Sign-In page
                }, 3000); // 3-second delay
            })
            .catch(error => {
                document.getElementById('status-message').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            });
    });
</script>
</body>
</html>
