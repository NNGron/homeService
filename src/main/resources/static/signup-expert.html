<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Expert Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/expert-actions.html">Expert Actions</a>
    <a class="current-page" href="/signup-expert.html">Sign Up Expert</a>
</div>

<!-- Back Button -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    function showMessage(message, isSuccess = true) {
        const statusMessage = document.getElementById('status-message');
        statusMessage.className = isSuccess ? 'status-success status-message' : 'status-error status-message';
        statusMessage.innerHTML = message;
    }
</script>

<!-- Title and Form -->
<div class="container mt-5 text-center">
    <h1 class="title">Expert Sign Up</h1>
    <form class="mt-4" id="expert-signup-form">
        <div class="mb-3">
            <label class="form-label" for="userName">Username:</label>
            <input class="form-control" id="userName" placeholder="Enter username (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" id="password"
                   placeholder="At least 8 characters, one uppercase, one lowercase, and one special character"
                   required type="password">
        </div>
        <div class="mb-3">
            <label class="form-label" for="firstName">First Name:</label>
            <input class="form-control" id="firstName" placeholder="Enter first name (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="lastName">Last Name:</label>
            <input class="form-control" id="lastName" placeholder="Enter last name (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" id="email" placeholder="Enter a valid email address (required)" required
                   type="email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="address">Address:</label>
            <input class="form-control" id="address" placeholder="Enter address (required)" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="subCategoryNames">SubCategories:</label>
            <input class="form-control" id="subCategoryNames" placeholder="Enter SubCategories (comma-separated)"
                   required type="text">
        </div>
        <button class="btn btn-lg btn-main" id="signup-btn" type="button">Sign Up</button>
    </form>
    <div class="mt-3" id="status-message"></div>
</div>

<script>
    document.getElementById('signup-btn').addEventListener('click', async () => {
        // Collect input data
        const expertData = {
            userName: document.getElementById('userName').value.trim(),
            password: document.getElementById('password').value.trim(),
            firstName: document.getElementById('firstName').value.trim(),
            lastName: document.getElementById('lastName').value.trim(),
            email: document.getElementById('email').value.trim(),
            address: document.getElementById('address').value.trim(),
            subCategoryNames: document.getElementById('subCategoryNames').value.split(',').map(sub => sub.trim()),
            userType: "EXPERT"
        };

        // Validation: Password
        const passwordRegex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$%^&+=])[A-Za-z\d@#$%^&+=]{8,}$/;
        if (!passwordRegex.test(expertData.password)) {
            showMessage('Password must be at least 8 characters long, include uppercase, lowercase, number, and special character.', false);
            return;
        }

        // Validation: Email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(expertData.email)) {
            showMessage('Please enter a valid email address.', false);
            return;
        }

        // Authorization token
        const token = localStorage.getItem('jwtToken');

        try {
            const response = await fetch('http://localhost:8080/v1/users/signup', {
                method: 'POST',
                headers: {
                    'Accept': '*/*',
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(expertData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.errorMessage || 'An error occurred during signup.');
            }

            const data = await response.json();
            showMessage(`Expert "${data.userName}" signed up successfully!`, true);

            // Redirect after success
            setTimeout(() => {
                window.location.href = "/expert-actions.html";
            }, 3000);
        } catch (error) {
            showMessage(`${error.message}`, false);
        }
    });
</script>
</body>
</html>
