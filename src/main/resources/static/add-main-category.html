<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Add Main Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a href="/category-management.html">Category Management</a>
    <a class="current-page" href="/add-main-category.html">Add main category</a>
</div>
<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/category-management.html"; // Navigate back to category management
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Add Main Category</h1>

    <!-- Default Categories -->
    <div id="defaultCategories">
        <!-- Predefined categories -->
        <div>
            <input id="decoration" name="categories" type="checkbox" value="Building Decoration">
            <label for="decoration">Building Decoration</label>
        </div>
        <div>
            <input id="construction" name="categories" type="checkbox" value="Building Installations">
            <label for="construction">Building Installations</label>
        </div>
        <div>
            <input id="vehicle" name="categories" type="checkbox" value="Vehicles">
            <label for="vehicle">Vehicles</label>
        </div>
        <div>
            <input id="moving" name="categories" type="checkbox" value="Moving and Transportation">
            <label for="moving">Moving and Transportation</label>
        </div>
        <div>
            <input id="appliances" name="categories" type="checkbox" value="Home Appliances">
            <label for="appliances">Home Appliances</label>
        </div>
        <div>
            <input id="cleaning" name="categories" type="checkbox" value="Cleaning and Hygiene">
            <label for="cleaning">Cleaning and Hygiene</label>
        </div>
    </div>

    <!-- New Category Input -->
    <div id="newCategoryContainer">
        <label class="form-label" for="newCategoryName">Enter new category name:</label>
        <input class="form-control" id="newCategoryName" placeholder="New category name" type="text">
        <button class="btn btn-lg btn-main" id="addCategoryBtn" type="button">Add Categories</button>
    </div>

    <!-- Added Categories -->
    <div class="mt-4" id="addedCategoriesContainer">
        <h3>Added Categories</h3>
        <ul id="addedCategoriesList" style="list-style-type: none; padding: 0;"></ul>
    </div>

    <!-- Status Message -->
    <div class="mt-3" id="status-message"></div>
</div>

<script>
    const addedCategories = []; // نگهداری لیست دسته‌بندی‌های اضافه‌شده

    // Fetch existing categories from the database when the page loads
    fetch('http://localhost:8080/v1/categories')
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to fetch categories');
            }
            return response.json();
        })
        .then(categories => {
            addedCategories.push(...categories.map(category => category.name)); // اضافه کردن دسته‌بندی‌های موجود
        })
        .catch(error => {
            console.error('Error fetching categories:', error);
        });

    document.getElementById('addCategoryBtn').addEventListener('click', () => {
        const newCategoryName = document.getElementById('newCategoryName').value.trim();
        const selectedCategories = Array.from(document.querySelectorAll('input[name="categories"]:checked')).map(input => input.value);

        const categoriesToAdd = selectedCategories;
        if (newCategoryName) {
            categoriesToAdd.push(newCategoryName);
        }

        // Fetch all existing categories from the database
        fetch('http://localhost:8080/v1/categories/main-categories', {
            method: 'GET',
            headers: {
                'Accept': '*/*'
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch main categories');
                }
                return response.json();
            })
            .then(existingCategories => {
                // Get list of existing category names
                const existingCategoryNames = existingCategories.map(category => category.name);

                categoriesToAdd.forEach(category => {
                    if (existingCategoryNames.includes(category)) {
                        displayMessage(`The category "${category}" already exists!`, 'error');
                    } else {
                        // Send a request to add the new category
                        fetch('http://localhost:8080/v1/categories/create-main-category', {
                            method: 'POST',
                            headers: {
                                'Accept': '*/*',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({name: category})
                        })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error(`Failed to add category: ${category}`);
                                }
                                return response.json();
                            })
                            .then(() => {
                                // Success message for adding a new category
                                const li = document.createElement('li');
                                li.textContent = category;
                                document.getElementById('addedCategoriesList').appendChild(li);

                                displayMessage(`The category "${category}" has been successfully added!`, 'success');
                            })
                            .catch(error => {
                                displayMessage(`Error: ${error.message}`, 'error');
                            });
                    }
                });
            })
            .catch(error => {
                displayMessage(`Error: ${error.message}`, 'error');
            });

        // Clear input fields
        document.getElementById('newCategoryName').value = '';
        document.querySelectorAll('input[name="categories"]:checked').forEach(input => {
            input.checked = false;
        });
    });

    function displayMessage(message, type) {
        const statusMessage = document.getElementById("status-message");
        statusMessage.className = `status-message ${type === 'success' ? 'status-success' : 'status-error'}`;
        statusMessage.innerHTML = message;

        // Automatically remove the message after 2 seconds
        setTimeout(() => {
            statusMessage.className = '';
            statusMessage.innerHTML = '';
        }, 2000);
    }
</script>
</body>
</html>
