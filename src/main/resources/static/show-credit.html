<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Show Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        td, th {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .table-container {
            width: 70%;
            margin: 30px auto;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/customer-dashboard.html">Customer Dashboard</a>
    <a class="current-page" href="/show-credit.html">Show Credit</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/customer-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center" style="width: 80%; margin: 0 auto;">
    <h1 class="title">Your Credit</h1>
    <p class="mt-3">See details about your available credit:</p>

    <!-- Credit Table -->
    <div class="table-container">
        <table class="table table-striped" style="font-size: 0.85rem; table-layout: fixed;">
            <thead>
            <tr>
                <th>Details</th>
                <th>Balance</th>
            </tr>
            </thead>
            <tbody id="creditTableBody">
            <!-- اطلاعات اعتبار به‌صورت داینامیک اینجا اضافه می‌شوند -->
            </tbody>
        </table>
    </div>

    <!-- Status Message -->
    <div class="mt-4" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const creditTableBody = document.getElementById("creditTableBody");
        const statusMessage = document.getElementById("statusMessage");

        // Fetching credit data from the backend
        fetch('http://localhost:8080/v1/credits/show-credit?email=expert1%40yahoo.com&password=expert11')
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text);
                    });
                }
                return response.json();
            })
            .then(creditData => {
                // افزودن داده‌ها به جدول
                creditTableBody.innerHTML = `
                <tr>
                    <td>Your current balance is:</td>
                    <td>${creditData.balance || "-"}</td>
                </tr>
                `;

                displayMessage("Credit information loaded successfully!", "success");
            })
            .catch(error => {
                displayMessage(`Error fetching credit: ${error.message}`, "error");
            });

        function displayMessage(message, type) {
            const statusMessage = document.getElementById("statusMessage");
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;

            // Automatically remove the message after 2 seconds
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 2000);
        }
    });
</script>
</body>
</html>
