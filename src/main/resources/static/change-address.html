<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Change Address</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 30px;
            width: 50%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/profile-customer.html">Profile</a>
    <a class="current-page" href="/change-address.html">Change Address</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/profile-customer.html";
    }
</script>

<!-- Title -->
<div class="container">
    <h1 class="title">Change Address</h1>
    <p class="mt-3">Update your current address:</p>

    <!-- Change Address Form -->
    <form id="changeAddressForm">
        <div class="form-group">
            <label class="form-label" for="newAddress">New Address:</label>
            <input
                    class="form-control"
                    id="newAddress"
                    maxlength="255"
                    placeholder="Enter your new address"
                    required
                    type="text">
        </div>
        <button class="btn btn-main btn-lg" type="submit">Update Address</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const changeAddressForm = document.getElementById("changeAddressForm");
        const statusMessage = document.getElementById("statusMessage");

        changeAddressForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const newAddress = document.getElementById("newAddress").value.trim();

            if (!newAddress) {
                displayMessage("Address must not be blank.", "error");
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/v1/users/update_users?email=customer1%40yahoo.com&password=customer1`, {
                    method: "PUT",
                    headers: {
                        "Accept": "*/*",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        userName: "customer1",
                        firstName: "customer1",
                        lastName: "customer1",
                        address: newAddress
                    })
                });

                if (!response.ok) {
                    const errorResponse = await response.json();
                    throw new Error(errorResponse.message || "Failed to update address.");
                }

                const data = await response.json();
                displayMessage(data.message || "Address updated successfully.", "success");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
