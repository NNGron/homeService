<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Get Users by Filter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        td, th {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .table-container {
            width: 80%;
            margin: 30px auto;
        }

        .form-container {
            width: 50%;
            margin: 20px auto;
        }

        .status-message {
            font-size: 1rem;
            margin: 20px auto; /* مرکزیت افقی */
            padding: 10px; /* فاصله داخلی برای خوانایی بهتر */
            border-radius: 5px; /* گوشه‌های گرد کادر */
            text-align: center; /* متن وسط‌چین */
            display: block; /* بلوکی شدن کادر برای کنترل بیشتر */
            width: fit-content; /* تنظیم عرض به اندازه متن */
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/get-users-by-filter.html">Get Users by Filter</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Get Users by Filter</h1>
    <p class="mt-3">Filter users by criteria:</p>

    <!-- Filter Form -->
    <div class="form-container">
        <form id="filterForm">
            <div class="form-group">
                <label class="form-label" for="userType">User Type:</label>
                <select class="form-control" id="userType" required>
                    <option value="EXPERT">EXPERT</option>
                    <option value="CUSTOMER">CUSTOMER</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="rating">Rating (Only for expert):</label>
                <input class="form-control" id="rating" max="5" min="1" placeholder="Enter rating" type="number">
            </div>
            <div class="form-group">
                <label class="form-label" for="firstName">First Name (optional):</label>
                <input class="form-control" id="firstName" placeholder="Enter first name" type="text">
            </div>
            <div class="form-group">
                <label class="form-label" for="lastName">Last Name (optional):</label>
                <input class="form-control" id="lastName" placeholder="Enter last name" type="text">
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email (optional):</label>
                <input class="form-control" id="email" placeholder="Enter email" type="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="categoryNames">Categories (optional):</label>
                <input class="form-control" id="categoryNames" placeholder="Enter category names (comma-separated)"
                       type="text">
            </div>
            <button class="btn btn-main btn-lg" type="submit">Filter Users</button>
        </form>
    </div>
</div>

<!-- Users Table -->
<div class="table-container">
    <table class="table table-striped" style="font-size: 0.85rem; table-layout: fixed;">
        <thead>
        <tr>
            <th>User Type</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Address</th>
            <th>Status</th>
            <th>Rating</th>
            <th>Categories</th>
            <th>Created At</th>
            <th>Updated At</th>
        </tr>
        </thead>
        <tbody id="usersTableBody">
        <!-- اطلاعات کاربران به صورت داینامیک اینجا اضافه می‌شود -->
        </tbody>
    </table>
</div>

<!-- Status Message -->
<div class="status-message d-none" id="statusMessage"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const filterForm = document.getElementById("filterForm");
        const usersTableBody = document.getElementById("usersTableBody");
        const statusMessage = document.getElementById("statusMessage");

        filterForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const userType = document.getElementById("userType").value;
            const rating = document.getElementById("rating").value.trim();
            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const email = document.getElementById("email").value.trim();
            const categoryNames = document.getElementById("categoryNames").value.trim().split(",");

            const filterData = {
                userType,
                rating: rating ? parseFloat(rating) : undefined,
                firstName: firstName || undefined,
                lastName: lastName || undefined,
                email: email || undefined,
                categoryNames: categoryNames.filter(name => name.trim())
            };

            try {
                const response = await fetch(`http://localhost:8080/v1/users/filter-users?pageNumber=0&size=10&sortBy=firstName&sortDir=asc`, {
                    method: "POST",
                    headers: {
                        "Accept": "*/*",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(filterData)
                });

                if (!response.ok) {
                    const errorResponse = await response.json();
                    throw new Error(errorResponse.message || "Failed to fetch filtered users.");
                }

                const users = await response.json();
                usersTableBody.innerHTML = ""; // Clear table

                if (users.length === 0) {
                    displayMessage("No users found for the given filter.", "error");
                    return;
                }

                users.forEach(user => {
                    const row = `
                    <tr>
                        <td>${user.userType}</td>
                        <td>${user.firstName}</td>
                        <td>${user.lastName}</td>
                        <td>${user.email}</td>
                        <td>${user.address || "-"}</td>
                        <td>${user.status}</td>
                        <td>${user.averageRate || "-"}</td>
                        <td>${user.categories?.map(category => category.name).join(", ") || "-"}</td>
                        <td>${user.createdAt || "N/A"}</td>
                        <td>${user.updatedAt || "N/A"}</td>
                    </tr>
                `;
                    usersTableBody.innerHTML += row;
                });

                displayMessage("Users filtered successfully.", "success");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
