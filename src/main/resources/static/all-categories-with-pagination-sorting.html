<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>All Categories with Pagination and Sorting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        td, th {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .table-container {
            width: 80%;
            margin: 30px auto;
        }

        .form-container {
            width: 50%;
            margin: 20px auto;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/category-management.html">Category Management</a>
    <a class="current-page" href="/all-categories-with-pagination-sorting.html">All Categories with Pagination and
        Sorting</a>
</div>
<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>
<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">All Categories</h1>
    <p class="mt-3">List of categories with pagination and sorting:</p>

    <!-- Form for Pagination and Sorting -->
    <div class="form-container">
        <form id="sortingForm">
            <div class="form-group">
                <label class="form-label" for="sortBy">Sort By:</label>
                <select class="form-control" id="sortBy" required>
                    <option value="name">Name</option>
                    <option value="basePrice">Base Price</option>
                    <option value="description">Description</option>
                    <option value="parentCategory.name">Parent Category</option>
                </select>
            </div>

            <div class="form-group mt-3">
                <label class="form-label" for="sortDir">Sort Direction:</label>
                <select class="form-control" id="sortDir" required>
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>
            <div class="form-group mt-3">
                <label class="form-label" for="pageNumber">Page Number:</label>
                <input class="form-control" id="pageNumber" min="0" required type="number" value="0">
            </div>
            <div class="form-group mt-3">
                <label class="form-label" for="pageSize">Page Size:</label>
                <input class="form-control" id="pageSize" min="1" required type="number" value="10">
            </div>
            <button class="btn btn-lg btn-primary mt-3" type="submit">Apply Filters</button>
        </form>
    </div>

    <!-- Categories Table -->
    <div class="table-container">
        <table class="table table-striped" style="font-size: 0.85rem; table-layout: fixed;">
            <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Base Price</th>
                <th>Parent Category</th>
            </tr>
            </thead>
            <tbody id="categoriesTableBody">
            <!-- اطلاعات دسته‌بندی‌ها به صورت داینامیک اینجا اضافه می‌شود -->
            </tbody>
        </table>
    </div>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const categoriesTableBody = document.getElementById("categoriesTableBody");
        const statusMessage = document.getElementById("statusMessage");
        const sortingForm = document.getElementById("sortingForm");
        const tableContainer = document.querySelector(".table-container");

        // Retrieve token from localStorage
        function getToken() {
            const token = localStorage.getItem("jwtToken");
            if (!token) {
                displayMessage("Authentication token is missing. Please log in again.", "error");
                throw new Error("Token is missing");
            }
            return token;
        }

        // Fetch categories based on user input
        async function fetchCategories(pageNumber, pageSize, sortBy, sortDir) {
            try {
                const token = getToken(); // Get token

                const response = await fetch(`http://localhost:8080/v1/categories/pageable-sort?pageNumber=${pageNumber}&size=${pageSize}&sortBy=${sortBy}&sortDir=${sortDir}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`, // Send token in header
                        'Accept': '*/*'
                    }
                });

                if (!response.ok) {
                    throw new Error("Failed to fetch categories.");
                }

                const categories = await response.json();
                categoriesTableBody.innerHTML = ""; // Clear table

                if (categories.length === 0) {
                    displayMessage("No categories found.", "error");
                    return;
                }

                categories.forEach(category => {
                    const row = `
                    <tr>
                        <td>${category.name}</td>
                        <td>${category.description || "-"}</td>
                        <td>${category.basePrice ? `$${category.basePrice}` : "-"}</td>
                        <td>${category.parentCategory ? category.parentCategory.name : "-"}</td>
                    </tr>
                    `;
                    categoriesTableBody.innerHTML += row;
                });

                displayMessage("Categories loaded successfully.", "success");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        }

        sortingForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const pageNumber = document.getElementById("pageNumber").value;
            const pageSize = document.getElementById("pageSize").value;
            const sortBy = document.getElementById("sortBy").value;
            const sortDir = document.getElementById("sortDir").value;

            // کاهش عرض جدول به ۸۰٪
            tableContainer.style.width = "55%";

            fetchCategories(pageNumber, pageSize, sortBy, sortDir);
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;
            statusMessage.classList.remove("d-none");

            // Clear the message after 3 seconds
            setTimeout(() => {
                statusMessage.className = "status-message d-none";
                statusMessage.textContent = "";
            }, 3000);
        }
    });
</script>
</body>
</html>
