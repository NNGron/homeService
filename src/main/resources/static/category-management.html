<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .action-buttons {
            display: flex; /* استفاده از Flexbox */
            flex-wrap: wrap; /* دکمه‌ها به صورت چند سطر در صورت نیاز نمایش داده شوند */
            justify-content: center; /* قرار دادن دکمه‌ها در مرکز افقی */
            gap: 30px; /* فاصله مساوی بین دکمه‌ها */
            margin-top: 20px; /* فاصله از بخش بالای صفحه */
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/admin-actions.html">Admin Actions</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/category-management.html">Category Management</a>
</div>

<!-- Buttons: Back and Forward -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
    <button class="forward-btn" onclick="navigateForward()">Forward</button>
</div>
<script>
    // عملکرد دکمه Back
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    // عملکرد دکمه Forward
    function navigateForward() {
        window.history.forward(); // حرکت به صفحه بعدی
    }
</script>

<!-- Title and Content -->
<div class="container mt-5 text-center">
    <h1 class="title">Category Management</h1>
    <p class="mt-3">Manage your categories efficiently by choosing an action below:</p>

    <!-- Action Buttons -->
    <div class="mt-5, action-buttons">
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToAddMainCategory()">Add Main Category</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToAddSubcategory()">Add Subcategory</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToMainCategoryDisplay()">Show Main Categories</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToSubCategoryDisplay()">Show Sub Categories</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToDeleteCategory()">Delete Category</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToAllCategoriesWithPaginationSorting()">All Categories
            With Pagination Sorting
        </button>
    </div>
</div>

<script>
    // هدایت به صفحات مختلف
    function navigateToAddMainCategory() {
        window.location.href = "/add-main-category.html";
    }

    function navigateToAddSubcategory() {
        window.location.href = "/add-subcategory.html";
    }

    function navigateToAllCategoriesWithPaginationSorting() {
        window.location.href = "/all-categories-with-pagination-sorting.html";
    }

    function navigateToDeleteCategory() {
        window.location.href = "/delete-category.html";
    }

    function navigateToMainCategoryDisplay() {
        window.location.href = "/show-main-categories.html";
    }

    function navigateToSubCategoryDisplay() {
        window.location.href = "/show-sub-categories.html";
    }
</script>
</body>
</html>
