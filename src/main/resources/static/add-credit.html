<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Add Credit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            width: 50%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .status-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/add-credit.html">Add Credit</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title and Form -->
<div class="container">
    <h1 class="title">Add Credit to Customer</h1>
    <p class="mt-3">Enter the email and amount of credit to add:</p>

    <form id="addCreditForm">
        <div class="form-group">
            <label class="form-label" for="customerEmail">Customer Email:</label>
            <input class="form-control" id="customerEmail" placeholder="Enter customer's email" required type="email">
        </div>
        <div class="form-group">
            <label class="form-label" for="creditAmount">Credit Amount:</label>
            <input class="form-control" id="creditAmount" placeholder="Enter credit amount" required type="number">
        </div>
        <button class="btn btn-lg btn-primary" type="submit">Add Credit</button>
    </form>

    <!-- Status Message -->
    <div class="status-message d-none" id="statusMessage"></div>
</div>

<script>
    document.getElementById("addCreditForm").addEventListener("submit", async (event) => {
        event.preventDefault();

        const customerEmail = document.getElementById("customerEmail").value.trim();
        const creditAmount = document.getElementById("creditAmount").value.trim();

        if (!customerEmail || !creditAmount || Number(creditAmount) <= 0) {
            displayMessage("Please fill in all fields and enter a valid credit amount.", "error");
            return;
        }

        try {
            const token = localStorage.getItem("jwtToken");
            if (!token) {
                displayMessage("Authentication token is missing. Please log in again.", "error");
                throw new Error("Token is missing");
            }

            const url = `http://localhost:8080/v1/credits/add-balance?email=${encodeURIComponent(customerEmail)}&balance=${encodeURIComponent(creditAmount)}`;
            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/json'
                }
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error("Error adding credit:", errorData);
                throw new Error(errorData.message || "Failed to add credit to customer.");
            }

            const responseData = await response.json();
            console.log("Credit Added Successfully:", responseData);
            displayMessage(`Credit added successfully to ${responseData.email}. Current balance: ${responseData.balance}`, "success");
        } catch (error) {
            console.error("Submission Error:", error);
            displayMessage(`Error: ${error.message}`, "error");
        }
    });

    function displayMessage(message, type) {
        const statusMessage = document.getElementById("statusMessage");
        statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
        statusMessage.textContent = message;
        statusMessage.classList.remove("d-none");

        // Clear the message after 3 seconds
        setTimeout(() => {
            statusMessage.className = "status-message d-none";
            statusMessage.textContent = "";
        }, 3000);
    }
</script>
</body>
</html>
