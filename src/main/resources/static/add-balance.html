<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Add Balance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/admin-dashboard.html">Admin Dashboard</a>
    <a class="current-page" href="/add-balance.html">Add Balance</a>
</div>

<!-- Back Button -->
<button class="back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/admin-dashboard.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center" style="width: 50%; margin: 0 auto;">
    <h1 class="title">Add Balance</h1>

    <!-- Add Balance Form -->
    <form class="mt-4" id="addBalanceForm">
        <div class="form-group">
            <label class="form-label" for="email">Customer Email:</label>
            <input class="form-control" id="email" placeholder="Enter customer email" required type="email">
        </div>

        <div class="form-group mt-3">
            <label class="form-label" for="balance">Balance to Add:</label>
            <input class="form-control" id="balance" min="0" placeholder="Enter balance amount" required
                   step="0.01" type="number">
        </div>

        <button class="btn btn-lg btn-main mt-4" type="submit">Add Balance</button>
    </form>

    <!-- Status Message -->
    <div class="mt-4" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const addBalanceForm = document.getElementById("addBalanceForm");

        addBalanceForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const balance = document.getElementById("balance").value.trim();

            if (!email || !balance) {
                displayMessage("Email and Balance are required!", "error");
                return;
            }

            // Send PUT request to add balance
            fetch(`http://localhost:8080/v1/credits/add-balance?email=${encodeURIComponent(email)}&balance=${balance}`, {
                method: "PUT",
                headers: {
                    "Accept": "*/*"
                }
            })
                .then(response => {
                    if (!response.ok) {
                        // Handle error response from the server
                        return response.json().then(errorResponse => {
                            throw new Error(errorResponse.errorMessage || "Email not found.");
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    // Ensure the response contains valid data
                    if (data && data.email && data.balance) {
                        displayMessage(`Balance successfully added for ${data.email}. Current balance: ${data.balance}`, "success");
                    } else {
                        throw new Error("User not found with provided email.");
                    }
                })
                .catch(error => {
                    // Display the error message
                    displayMessage(`Error: ${error.message}`, "error");
                });
        });

        function displayMessage(message, type) {
            const statusMessage = document.getElementById("statusMessage");
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;

            // Automatically remove the message after 2 seconds
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 2000);
        }
    });
</script>
</body>
</html>
