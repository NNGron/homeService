<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Expert Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/expert-actions.html">Expert Actions</a>
    <a class="current-page" href="/login-expert.html">Login</a>
</div>

<!-- Buttons: Back -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }
</script>

<!-- Title and Form -->
<div class="container mt-5 text-center">
    <h1 class="title">Expert Login</h1>
    <form class="mt-4" id="expert-login-form">
        <div class="mb-3">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" id="email" placeholder="Enter your email address" required type="email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" id="password" placeholder="Enter your password" required type="password">
        </div>
        <button class="btn btn-lg btn-main" id="login-btn" type="button">Login</button>
    </form>
    <div class="status-message mt-3" id="status-message"></div> <!-- محل پیام‌ها -->
</div>

<script>
    document.getElementById('login-btn').addEventListener('click', () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const loginData = {email, password};

        fetch('http://localhost:8080/v1/users/login', {
            method: 'POST',
            headers: {
                'Accept': '*/*',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(loginData)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Login failed. Please check your email and password.');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('status-message').innerHTML = `<div class="alert alert-success">Welcome back, Expert ${data.firstName}!</div>`;
                setTimeout(() => {
                    window.location.href = "/expert-dashboard.html"; // انتقال به داشبورد
                }, 2000); // 2-second delay
            })
            .catch(error => {
                document.getElementById('status-message').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            });
    });
</script>
</body>
</html>
