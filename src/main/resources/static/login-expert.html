<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Expert Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a href="/expert-actions.html">Expert Actions</a>
    <a class="current-page" href="/login-expert.html">Login</a>
</div>

<!-- Buttons: Back -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    function showMessage(message, isSuccess = true) {
        const statusMessage = document.getElementById('status-message');
        statusMessage.className = isSuccess ? 'status-success status-message' : 'status-error status-message';
        statusMessage.innerHTML = message;
    }
</script>

<!-- Title and Form -->
<div class="container mt-5 text-center">
    <h1 class="title">Expert Login</h1>
    <form class="mt-4" id="expert-login-form">
        <div class="mb-3">
            <label class="form-label" for="email">Email:</label>
            <input class="form-control" id="email" placeholder="Enter your email address" required type="email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password:</label>
            <input class="form-control" id="password" placeholder="Enter your password" required type="password">
        </div>
        <button class="btn btn-lg btn-main" id="login-btn" type="button">Login</button>
    </form>
    <div class="status-message mt-3" id="status-message"></div> <!-- محل پیام‌ها -->
</div>

<script>
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const statusMessage = document.getElementById('status-message');

        const loginData = { email, password };

        try {
            const response = await fetch('http://localhost:8080/v1/users/login', {
                method: 'POST',
                headers: {
                    'Accept': '*/*',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(loginData)
            });

            if (!response.ok) {
                const errorData = await response.json();
                if (errorData.errorCode === 75) {
                    // نمایش پیام تایید نشده بودن حساب کاربری
                    statusMessage.className = 'status-message status-error';
                    statusMessage.innerHTML = `<div class="alert alert-danger">
                        Error: ${errorData.errorMessage} <br>
                        Please check your email for the verification link after signing up. Verify your email and wait for the admin to approve your account.
                    </div>`;
                } else {
                    throw new Error(errorData.errorMessage || "An error occurred during login.");
                }
                return;
            }

            const data = await response.json();
            const token = data.token;
            localStorage.setItem("jwtToken", token);

            statusMessage.className = 'status-message status-success';
            statusMessage.innerHTML = `<div class="alert alert-success">Welcome back!</div>`;
            setTimeout(() => {
                window.location.href = "/expert-dashboard.html";
            }, 2000);

        } catch (error) {
            statusMessage.className = 'status-message status-error';
            statusMessage.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
        }
    });
</script>
</body>
</html>
