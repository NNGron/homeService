<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Update Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <style>
        .form-control {
            width: 50%; /* عرض اینپوت‌ها 50 درصد */
            margin: 0 auto; /* مرکزچینی */
        }

        .form-container {
            text-align: center;
            margin-top: 50px;
        }

        .btn-primary {
            margin-top: 20px;
        }

        .status-message {
            font-size: 1rem;
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }

        .status-success {
            color: #155724;
        }

        .status-error {
            color: #721c24;
        }
    </style>
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/order-management.html">Order Management</a>
    <a class="current-page" href="/update-order.html">Update Order</a>
</div>

<!-- Back Button -->
<button class="btn back-btn" onclick="navigateBack()">Back</button>
<script>
    function navigateBack() {
        window.location.href = "/order-management.html";
    }
</script>

<!-- Title -->
<div class="container mt-5 text-center">
    <h1 class="title">Update Order</h1>
    <p>Fill in the fields below to update your order:</p>
</div>

<!-- Update Order Form -->
<div class="form-container">
    <form id="updateOrderForm">
        <div class="mb-3">
            <label class="form-label" for="orderId">Order Number:</label>
            <input class="form-control" id="orderId" placeholder="Enter order ID" required type="number">
        </div>
        <div class="mb-3">
            <label class="form-label" for="offerCustomerPrice">Offer Customer Price:</label>
            <input class="form-control" id="offerCustomerPrice" placeholder="Enter offer customer price" required
                   type="number">
        </div>
        <div class="mb-3">
            <label class="form-label" for="orderDate">Order Date:</label>
            <input class="form-control" id="orderDate" required type="date">
        </div>
        <div class="mb-3">
            <label class="form-label" for="orderDescription">Order Description:</label>
            <input class="form-control" id="orderDescription" placeholder="Enter order description" required
                   type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="executionDate">Execution Date:</label>
            <input class="form-control" id="executionDate" required type="date">
        </div>
        <div class="mb-3">
            <label class="form-label" for="orderAddress">Order Address:</label>
            <input class="form-control" id="orderAddress" placeholder="Enter order address" required type="text">
        </div>
        <div class="mb-3">
            <label class="form-label" for="subCategoryName">SubCategory Name:</label>
            <input class="form-control" id="subCategoryName" placeholder="Enter sub-category name" required type="text">
        </div>
        <button class="btn btn-main btn-lg" type="submit">Submit Update</button>
    </form>

    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const updateOrderForm = document.getElementById("updateOrderForm");
        const statusMessage = document.getElementById("statusMessage");

        updateOrderForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const orderId = document.getElementById("orderId").value.trim();
            const offerCustomerPrice = document.getElementById("offerCustomerPrice").value.trim();
            const orderDate = document.getElementById("orderDate").value.trim();
            const orderDescription = document.getElementById("orderDescription").value.trim();
            const executionDate = document.getElementById("executionDate").value.trim();
            const orderAddress = document.getElementById("orderAddress").value.trim();
            const subCategoryName = document.getElementById("subCategoryName").value.trim();

            if (!orderId || !offerCustomerPrice || !orderDate || !orderDescription || !executionDate || !orderAddress || !subCategoryName) {
                displayMessage("All fields are required.", "error");
                return;
            }

            const updateData = {
                offerCustomerPrice,
                orderDate,
                orderDescription,
                executionDate,
                orderAddress,
                subCategoryName
            };

            try {
                const response = await fetch(`http://localhost:8080/v1/orders/update-order?email=customer1%40yahoo.com&password=customer1&orderId=${orderId}`, {
                    method: "PUT",
                    headers: {
                        "Accept": "*/*",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(updateData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.errorMessage || "Unknown error occurred.");
                }

                const data = await response.json();
                displayMessage(`Order ID ${orderId} has been successfully updated!`, "success");
            } catch (error) {
                displayMessage(`Error: ${error.message}`, "error");
            }
        });

        function displayMessage(message, type) {
            statusMessage.className = `status-message ${type === "success" ? "status-success" : "status-error"}`;
            statusMessage.textContent = message;

            // حذف پیام پس از ۳ ثانیه
            setTimeout(() => {
                statusMessage.className = '';
                statusMessage.textContent = '';
            }, 3000);
        }
    });
</script>
</body>
</html>
