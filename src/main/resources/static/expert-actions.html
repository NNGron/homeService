<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Expert Actions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>
<body class="bg-spring">
<!-- Navigator -->
<div class="navigator">
    <a href="/index.html">Home</a>
    <a href="/role-selection.html">Role Selection</a>
    <a class="current-page" href="/expert-actions.html">Expert Actions</a>
</div>

<!-- Buttons: Back and Forward -->
<div class="navigation-buttons">
    <button class="back-btn" onclick="navigateBack()">Back</button>
    <button class="forward-btn" onclick="navigateForward()">Forward</button>
</div>

<script>
    function navigateBack() {
        window.history.back(); // بازگشت به صفحه قبلی
    }

    function navigateForward() {
        window.history.forward(); // حرکت به صفحه بعدی از تاریخچه مرورگر
    }
</script>

<div class="container text-center mt-5">
    <h1 class="title">Dear Expert, Please Choose</h1>
    <p class="mt-3">Select one of the following options:</p>
    <div class="mt-5">
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToSignUp()">Sign Up</button>
        <button class="btn btn-lg btn-main mx-2" onclick="navigateToSignIn()">Sign In</button>
    </div>
</div>

<script>
    function navigateToSignUp() {
        window.location.href = "/signup-expert.html"; // هدایت به صفحه ثبت‌نام کارشناسان
    }

    function navigateToSignIn() {
        window.location.href = "/login-expert.html"; // هدایت به صفحه ورود کارشناسان
    }
</script>
</body>
</html>
