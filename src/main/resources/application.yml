#spring.application.name=sanaz-spring
server:
  port: 8080

spring:
  application:
    name: core banking

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/homeservicev2
    username: Maktab
    password: Maktab123
    hikari:
          auto-commit: false

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

    # تنظیمات فایل‌های استاتیک و قالب
  mvc:
    view:
      prefix: classpath:/templates/
      suffix: .html
  web:
    resources:
      static-locations: classpath:/static

  # تنظیمات آپلود فایل
  servlet:
    multipart:
      max-file-size: 300KB
      max-request-size: 300KB

logging:
  level:
    root: info
    org.springframework: debug # فعال‌سازی لاگ در سطح Debug